[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "nerust_rom_test"
rust-version.workspace = true
version.workspace = true

[dependencies]
bitflags.workspace = true
clap.workspace = true
crc.workspace = true
nerust_core_traits.workspace = true
nerust_input_traits.workspace = true
nerust_render_traits.workspace = true
png.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true

# NES system support. Optional so the harness core stays system-agnostic;
# GBC/GBA adapters will follow the same pattern. Build with `--features nes`.
nerust_nes_core = { workspace = true, optional = true }
nerust_nes_device = { workspace = true, optional = true }
nerust_nes_factory = { workspace = true, optional = true }
nerust_nes_settings = { workspace = true, optional = true }

[features]
default = []
nes = [
    "dep:nerust_nes_core",
    "dep:nerust_nes_factory",
    "dep:nerust_nes_device",
    "dep:nerust_nes_settings",
]

[[bin]]
name = "rom_tool"
path = "src/bin/rom_tool.rs"
required-features = ["nes"]

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
required-features = ["nes"]

[[test]]
name = "lib"
path = "tests/lib.rs"
required-features = ["nes"]
