[workspace]
members = ["contract", "definition", "build", "runtime", "gtk", "tao", "demo-contract", "demo-controls", "demo"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
version = "0.1.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = "=2.0.0"
typetag = "=0.2.23"
thiserror = "=2.0.21"
futures = "=0.3.34"
gtk = { package = "gtk4", version = "=0.11.5" }
tao = "=0.37.2"
wakui-contract = { path = "contract" }
wakui-definition = { path = "definition" }
wakui-build = { path = "build" }
wakui-runtime = { path = "runtime" }
wakui-gtk = { path = "gtk" }
wakui-tao = { path = "tao" }
demo-contract = { path = "demo-contract" }
demo-controls = { path = "demo-controls" }

[profile.dev]
debug = 0

[profile.test]
debug = 0