[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "nerust_render_traits"
rust-version.workspace = true
version.workspace = true

[dependencies]
log.workspace = true
raw-window-handle = { optional = true, workspace = true }
serde = { features = ["derive"], workspace = true }

[features]
default = ["renderer"]
# Core frame/profile/color data can be used without native-window interfaces.
renderer = ["dep:raw-window-handle"]
