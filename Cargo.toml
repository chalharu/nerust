[workspace]
default-members = [
  ".",
  "console/gba/core",
  "console/gbc/core",
  "console/nes/core",
]
exclude = ["panechord"]
members = [
  "console/gba/core",
  "console/gba/device",
  "console/gba/factory",
  "console/gba/settings",
  "console/gbc/core",
  "console/gbc/device",
  "console/gbc/factory",
  "console/gbc/settings",
  "console/input",
  "console/nes/controller",
  "console/nes/core",
  "console/nes/device",
  "console/nes/factory",
  "console/nes/settings",
  "crash-guard",
  "gui/application",
  "gui/emu-thread",
  "gui/frontends/android",
  "gui/frontends/desktop",
  "gui/frontends/headless",
  "gui/frontends/rom_tool",
  "gui/run-options",
  "gui/runtime",
  "gui/shell",
  "gui/viewmodel",
  "persistence",
  "render/filters",
  "render/gl",
  "render/glwrap",
  "render/ntsc",
  "render/osd",
  "render/softbuffer",
  "render/traits",
  "render/wgpu",
  "serialize",
  "settings/core",
  "sound/cpal",
  "sound/cubeb",
  "sound/filter",
  "sound/spectrum",
  "timer",
  "traits/core",
  "traits/input",
  "traits/settings",
  "traits/system",
]
resolver = "3"

[package]
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "nerust"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
clap.workspace = true
log.workspace = true
nerust_core_traits.workspace = true
nerust_crash_guard.workspace = true
nerust_desktop = { default-features = false, workspace = true }
nerust_gba_factory = { optional = true, workspace = true }
nerust_gbc_factory = { optional = true, workspace = true }
nerust_gui_runtime.workspace = true
nerust_gui_shell.workspace = true
nerust_nes_factory = { optional = true, workspace = true }
nerust_render_gl = { optional = true, workspace = true }
nerust_render_softbuffer = { optional = true, workspace = true }
nerust_render_traits = { features = ["renderer"], workspace = true }
nerust_render_wgpu = { optional = true, workspace = true }
nerust_run_options.workspace = true
nerust_sound_cpal = { optional = true, workspace = true }
nerust_sound_cubeb = { optional = true, workspace = true }
nerust_system_traits.workspace = true
simple_logger.workspace = true

[dev-dependencies]
nerust_gba_core.workspace = true
nerust_settings_core.workspace = true

[features]
cpal = ["nerust_sound_cpal"]
cubeb = ["nerust_sound_cubeb"]
default = ["cpal", "cubeb", "desktop-native", "gba", "gbc", "nes", "wgpu"]
desktop-native = ["nerust_desktop/native"]
gba = ["nerust_gba_factory"]
gbc = ["nerust_gbc_factory"]
gtk = ["nerust_desktop/gtk"]
nes = ["nerust_nes_factory"]
opengl = ["nerust_render_gl"]
softbuffer = ["nerust_render_softbuffer"]
tao = ["nerust_desktop/tao"]
wgpu = ["nerust_render_wgpu"]

[profile.dev]
opt-level = 3

[profile.release]
debug = "line-tables-only"
# ThinLTO improves Myst's release frame throughput in the core benchmark;
# fat LTO was slower in the same benchmark.
lto = "thin"
# ThinLTO emits full DWARF despite line-tables-only (156MB APK incident);
# strip it at link time, keeping symtab for backtrace symbol names.
# Release backtraces are name-only: file:line needs DWARF, absent here.
strip = "debuginfo"

[profile.release.package.nerust_nes_core]
codegen-units = 1

# GBA core: single codegen unit lets the per-T-cycle hot path
# (bus tick, timers, DMA, APU) inline across modules; measurable on
# mobile CPUs where the ~280k ticks/frame dominate Pokemon Emerald.
[profile.release.package.nerust_gba_core]
codegen-units = 1

[workspace.package]
authors = ["chalharu"]
description = "NES emulator written in Rust"
edition = "2024"
homepage = "https://github.com/chalharu/nerust"
license = "MPL-2.0"
repository = "https://github.com/chalharu/nerust"
rust-version = "1.95"
version = "0.1.0-dev"

[workspace.dependencies]
ab_glyph = { version = "=0.2.32" }
android_logger = { version = "=0.15.1" }
base64 = { version = "=0.23.1" }
bitflags = { features = ["serde"], version = "=2.13.2" }
