jni = { version = "=0.22.4" }
log = { default-features = false, version = "=0.4.35" }
muda = { default-features = false, features = ["gtk3"], version = "=0.21.2" }
nerust_android = { path = "gui/frontends/android" }
nerust_console_input = { path = "console/input" }
nerust_core_traits = { path = "traits/core" }
nerust_crash_guard = { path = "crash-guard" }
nerust_desktop = { path = "gui/frontends/desktop" }
nerust_emu_thread = { path = "gui/emu-thread" }
nerust_gba_core = { path = "console/gba/core" }
nerust_gba_device = { path = "console/gba/device" }
nerust_gba_factory = { path = "console/gba/factory" }
nerust_gba_settings = { path = "console/gba/settings" }
nerust_gbc_core = { path = "console/gbc/core" }
nerust_gbc_device = { path = "console/gbc/device" }
nerust_gbc_factory = { path = "console/gbc/factory" }
nerust_gbc_settings = { path = "console/gbc/settings" }
nerust_glwrap = { path = "render/glwrap" }
nerust_gui_application = { path = "gui/application" }
nerust_gui_runtime = { path = "gui/runtime" }
nerust_gui_shell = { path = "gui/shell" }
