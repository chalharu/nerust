sonar.projectKey=chalharu_nerust
sonar.organization=chalharu
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=target/**,**/target/**,roms/**,**/*.png,**/*.jar
# Only the Kotlin/Gradle wrapper stays out (no JVM coverage pipeline).
sonar.coverage.exclusions=packaging/android/**
sonar.rust.lcov.reportPaths=coverage/*.info
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/docker/Dockerfile.sonarcloud
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile*
# Debug-only fault stub: the platform mandates MANAGE_DOCUMENTS for both
# read and write on installed DocumentsProviders (dropping either crashes
# installation); same value for both is required, not a choice.
sonar.issue.ignore.multicriteria.e3.ruleKey=xml:S6361
sonar.issue.ignore.multicriteria.e3.resourceKey=packaging/android/app/src/debug/AndroidManifest.xml
