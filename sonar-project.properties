sonar.projectKey=chalharu_nerust
sonar.organization=chalharu
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=target/**,**/target/**,roms/**,**/*.png,**/*.jar
sonar.coverage.exclusions=gui/frontends/android/**,packaging/android/**
sonar.rust.lcov.reportPaths=coverage/*.info
# Copy-paste detection skips data-like mirrors by design, not logic:
# per-CPU opcode decode tables (one match row per opcode reads the
# same in every ISA) and the locale catalog (every language mirrors
# the same key list). Shared logic still lives in shared code and
# stays in scope: viewmodel helpers, the tao window shell, drains.
sonar.cpd.exclusions=gba/core/src/disasm_gba.rs,gbc/core/src/disasm_gb.rs,nes/core/src/disasm6502.rs,settings/core/src/i18n.rs
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/docker/Dockerfile.sonarcloud
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile*
