extend-exclude = ["roms"]
force-exclude = true
target-version = "py311"

[lint.per-file-ignores]
# Review automation polls a live desktop: any transient AT-SPI error means
# "not ready yet", and the main guard must report failures instead of
# tracebacks. Narrowing these would abort CI runs on unlisted transients.
"gui/frontends/desktop/scripts/review-main.py" = ["BLE001"]
"gui/frontends/desktop/scripts/review-master-auxiliary.py" = ["BLE001"]
