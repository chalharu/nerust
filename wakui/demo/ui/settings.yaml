schema_version: 1
view_model: sample.Settings
resources:
  title: "Wakui — declarative MVVM prototype"
templates:
  row:
    data_type: sample.Row
    root:
      type: wakui.Label
      common: { id: row_label }
      text: { bind: { path: name } }
root:
  type: wakui.Window
  common: { id: settings }
  title: { resource: title }
  menubar:
    items:
      - type: wakui.Submenu
        id: file
        text: "Actions"
        items:
          - type: wakui.MenuItem
            id: save_menu
            text: { literal: "Save settings" }
            command: { path: save }
  content:
    type: wakui.Panel
    common: { id: form }
    gap: 12
    children:
      - type: sample.Heading
        common: { id: heading }
        text: { literal: "Wakui · one definition, typed bindings" }
      - type: wakui.Label
        common: { id: caption }
        text: { literal: "Name (TwoWay). Save runs on a bounded worker pool." }
      - type: wakui.TextBox
        common: { id: name }
        text: { bind: { path: name, mode: two_way } }
      - type: wakui.Label
        common: { id: echo }
        text: { bind: { path: name } }
      - type: wakui.Button
        common: { id: save_button }
        text: { literal: "Save asynchronously" }
        command: { path: save }
      - type: wakui.Label
        common: { id: status }
        text: { bind: { path: status } }
      - type: wakui.Button
        common: { id: add }
        text: { literal: "Add name to list" }
        command: { path: add }
      - type: wakui.Button
        common: { id: reverse }
        text: { literal: "Reverse items (stable keys)" }
        command: { path: reverse }
      - type: wakui.Button
        common: { id: clear }
        text: { literal: "Clear items" }
        command: { path: clear }
      - type: wakui.ItemsControl
        common: { id: rows }
        items: { path: rows }
        item_key: id
        item_template: row
      - type: wakui.TextBox
        common: { id: name_preview }
        text: { bind: { path: name, mode: one_way } }