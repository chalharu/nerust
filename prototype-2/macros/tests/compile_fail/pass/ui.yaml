schema_version: 2
root:
  type: Window
  id: window
  title: {bind: {path: name}}
  content:
    type: StackLayout
    id: stack
    children:
      - type: Label
        id: label
        text: {literal: before-yaml-edit}
      - type: TextBox
        id: entry
        text: {bind: {path: name, mode: TwoWay}}
      - type: Button
        id: button
        text: {literal: Reset}
        command: reset