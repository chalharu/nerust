[package]
name = "wakui2-tao"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
wakui2-runtime.workspace = true
futures.workspace = true
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "wayland", "advanced", "thread-pool"] }
iced_tiny_skia = "=0.14.1"
iced_winit = "=0.14.1"
tao = "=0.37.2"
muda = "=0.21.2"
window_clipboard = "=0.5.1"
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }