name: Panechord

on:
  push:
    paths:
      # The submodule pointer itself (`panechord`): content changes inside
      # the submodule never appear in superproject diffs, so the gitlink
      # path must be listed alongside the content glob.
      - "panechord"
      - "panechord/**"
      - "gui/frontends/desktop/**"
      - "gui/frontends/check_frontend_policy.py"
      - ".github/workflows/panechord.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "panechord"
      - "panechord/**"
      - "gui/frontends/desktop/**"
      - "gui/frontends/check_frontend_policy.py"
      - ".github/workflows/panechord.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panechord-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux GTK and Tao Formal Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch panechord submodule
        run: git submodule update --init panechord
      - name: Native regressions and release CPU budgets
        run: sh panechord/scripts/verify-docker.sh