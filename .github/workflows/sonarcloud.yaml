name: SonarCloud
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  prepare-image:
    name: Prepare image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    outputs:
      image_tag: "${{ steps.set-tag.outputs.tag }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ hashFiles('.github/workflows/docker/Dockerfile.sonarcloud') }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if image exists
        id: check-image
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker pull ghcr.io/${{ env.GH_REPO }}/ci-image-sonarcloud:${{ env.IMAGE_TAG }}
      - name: Build and push if not exists
        if: steps.check-image.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/workflows/docker/Dockerfile.sonarcloud
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-image-sonarcloud:${{ steps.set-tag.outputs.tag }}
          provenance: false
  sonarcloud:
    name: SonarCloud
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-sonarcloud:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      - name: Initialize coverage environment
        run: mkdir -p coverage
      - name: Generate coverage report (wgpu, tao)
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          cargo llvm-cov --workspace --exclude nerust_rom_test \
            --features tao,wgpu --lcov --output-path coverage/lcov-tao.info
          workspace_root="${PWD%/}/"
          sed -i "s#^SF:${workspace_root}#SF:#" coverage/lcov-tao.info
      - name: Generate coverage report (opengl, gtk)
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          xvfb-run cargo llvm-cov --workspace --exclude nerust_rom_test \
            --exclude nerust_gbc_rom_test --exclude nerust_gbc_core \
            --exclude nerust_nes_core --no-default-features --features gtk,opengl,nes \
            --lcov --output-path coverage/lcov-gtk.info
          workspace_root="${PWD%/}/"
          sed -i "s#^SF:${workspace_root}#SF:#" coverage/lcov-gtk.info
      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
