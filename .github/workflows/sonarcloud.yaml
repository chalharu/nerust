name: SonarCloud
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  prepare-image:
    name: Prepare image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    outputs:
      image_tag: "${{ steps.set-tag.outputs.tag }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ hashFiles('.github/workflows/docker/Dockerfile.sonarcloud') }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if image exists
        id: check-image
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker pull "ghcr.io/$GH_REPO/ci-image-sonarcloud:$IMAGE_TAG"
      - name: Build and push if not exists
        if: steps.check-image.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .github/workflows/docker/Dockerfile.sonarcloud
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-image-sonarcloud:${{ steps.set-tag.outputs.tag }}
          provenance: false
  build-rom-tests:
    name: Build ROM tests
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-sonarcloud:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      - name: Build test archive
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          mkdir -p artifacts
          # Single headless-harness build (all three systems, CI subset).
          # NERUST_ROM_CI is read by build.rs at compile time, so it must
          # be set here, not at run time.
          export NERUST_ROM_CI=1
          cargo llvm-cov nextest-archive -p nerust_rom_test \
            --features nes,gbc,gba --archive-file artifacts/rom.tar.zst
      - name: Upload test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-rom
          path: artifacts/rom.tar.zst
          compression-level: 0
          retention-days: 1
  coverage-tao:
    name: Test coverage (tao)
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-sonarcloud:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      - name: Build and run tests with coverage
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          mkdir -p coverage target/llvm-cov-target
          cargo llvm-cov nextest --no-report --workspace --exclude nerust_rom_test \
            --features tao,wgpu
          cargo llvm-cov report \
            --no-default-ignore-filename-regex \
            --lcov --output-path coverage/raw.info
          workspace_root="${PWD%/}/"
          awk -v prefix="SF:${workspace_root}" '
            /^SF:/ { include = index($0, prefix) == 1 }
            include { print }
            /^end_of_record$/ { include = 0 }
          ' coverage/raw.info > coverage/lcov-tao.info
          rm coverage/raw.info
          sed -i "s#^SF:${workspace_root}#SF:#" coverage/*.info
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-tao
          path: coverage/*.info
          retention-days: 1
  coverage-gtk:
    name: Test coverage (gtk)
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-sonarcloud:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      - name: Build and run tests with coverage
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          mkdir -p coverage target/llvm-cov-target
          xvfb-run cargo llvm-cov nextest --no-report --workspace \
            --exclude nerust_rom_test --exclude nerust_gbc_core \
            --exclude nerust_nes_core --no-default-features --features gtk,opengl,nes
          cargo llvm-cov report \
            --no-default-ignore-filename-regex \
            --lcov --output-path coverage/raw.info
          workspace_root="${PWD%/}/"
          awk -v prefix="SF:${workspace_root}" '
            /^SF:/ { include = index($0, prefix) == 1 }
            include { print }
            /^end_of_record$/ { include = 0 }
          ' coverage/raw.info > coverage/lcov-gtk.info
          rm coverage/raw.info
          sed -i "s#^SF:${workspace_root}#SF:#" coverage/*.info
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-gtk
          path: coverage/*.info
          retention-days: 1
  rom-tests:
    name: ROM tests (nextest ${{ matrix.shard }}/${{ matrix.total }})
    needs:
      - prepare-image
      - build-rom-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-sonarcloud:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      NERUST_ROM_CI: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download test archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-archive-rom
          path: artifacts
      # Single prebuilt archive, hash-sharded at run time. Coverage runs
      # under llvm-cov so the session/engine paths exercised by ROM cases
      # count toward the SonarCloud gate; the lcov fragment merges with
      # the unit fragments in the sonarcloud job.
      - name: ROM tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: |
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          mkdir -p coverage target/llvm-cov-target
          cargo llvm-cov nextest --no-report \
            --archive-file artifacts/rom.tar.zst \
            --partition hash:${{ matrix.shard }}/${{ matrix.total }}
          cargo llvm-cov report \
            --nextest-archive-file artifacts/rom.tar.zst \
            --no-default-ignore-filename-regex \
            --lcov --output-path coverage/raw.info
          workspace_root="${PWD%/}/"
          awk -v prefix="SF:${workspace_root}" '
            /^SF:/ { include = index($0, prefix) == 1 }
            include { print }
            /^end_of_record$/ { include = 0 }
          ' coverage/raw.info > coverage/lcov-rom-${{ matrix.shard }}.info
          rm coverage/raw.info
          sed -i "s#^SF:${workspace_root}#SF:#" coverage/*.info
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-rom-${{ matrix.shard }}
          path: coverage/*.info
          retention-days: 1
  coverage-bins:
    name: Test coverage (bins)
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-sonarcloud:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      # CLI binaries never execute under nextest, so their lines stay
      # uncovered without this. One tiny NES case exercises the
      # list/validate/report/perf paths in seconds.
      - name: Run binaries with coverage
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          mkdir -p coverage target/llvm-cov-target
          cargo llvm-cov run --no-report -p nerust_rom_test --features nes \
            --bin rom_tool -- list --case apu.len_ctr
          cargo llvm-cov run --no-report -p nerust_rom_test --features nes \
            --bin rom_tool -- validate --case apu.len_ctr
          cargo llvm-cov run --no-report -p nerust_rom_test --features nes \
            --bin perf -- --rounds 1 --warmup-rounds 0 --case apu.len_ctr
          cargo llvm-cov report \
            --no-default-ignore-filename-regex \
            --lcov --output-path coverage/raw.info
          workspace_root="${PWD%/}/"
          awk -v prefix="SF:${workspace_root}" '
            /^SF:/ { include = index($0, prefix) == 1 }
            include { print }
            /^end_of_record$/ { include = 0 }
          ' coverage/raw.info > coverage/lcov-bins.info
          rm coverage/raw.info
          sed -i "s#^SF:${workspace_root}#SF:#" coverage/*.info
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-bins
          path: coverage/*.info
          retention-days: 1
  sonarcloud:
    name: SonarCloud
    needs:
      - coverage-tao
      - coverage-gtk
      - coverage-bins
      - rom-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lcov-*
          path: coverage
          merge-multiple: true
      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
