name: SonarCloud
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang mold \
            libgtk-3-dev \
            libgtk-4-dev \
            libepoxy-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libasound2-dev \
            libcubeb-dev \
            libudev-dev
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview, clippy
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version =0.8.7
      - name: Generate coverage report (tao + wgpu)
        continue-on-error: true
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          cargo llvm-cov --workspace --exclude nerust_rom_test --features tao,wgpu --lcov --output-path coverage/tao.lcov
          workspace_root="${PWD%/}/"
          sed -i "s#^SF:${workspace_root}#SF:#" coverage/tao.lcov
      - name: Generate coverage report (gtk + opengl)
        continue-on-error: true
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          export LIBCUBEB_SYS_USE_PKG_CONFIG=1
          cargo llvm-cov --workspace --exclude nerust_rom_test --features gtk,opengl --lcov --output-path coverage/gtk.lcov
          workspace_root="${PWD%/}/"
          sed -i "s#^SF:${workspace_root}#SF:#" coverage/gtk.lcov
      - name: Merge coverage reports
        run: |
          pip install lcov-cobertura 2>/dev/null || true
          # Merge by summing DA line hits across both runs
          python3 -c "
import re, collections, sys

files = collections.defaultdict(lambda: collections.defaultdict(int))
for path in ['coverage/tao.lcov', 'coverage/gtk.lcov']:
    try:
        with open(path) as f:
            current_sf = None
            for line in f:
                line = line.rstrip()
                if line.startswith('SF:'):
                    current_sf = line[3:]
                elif line.startswith('DA:'):
                    m = re.match(r'DA:(\d+),(\d+)', line)
                    if m:
                        line_no = int(m.group(1))
                        hits = int(m.group(2))
                        files[current_sf][line_no] += hits
            except FileNotFoundError:
                pass

with open('coverage/lcov.info', 'w') as out:
    for sf, lines in sorted(files.items()):
        out.write(f'SF:{sf}\n')
        for line_no in sorted(lines):
            out.write(f'DA:{line_no},{lines[line_no]}\n')
        out.write('end_of_record\n')
print('Merged coverage written to coverage/lcov.info')
"
      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
