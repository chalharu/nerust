[package]
name = "nerust_gba_factory"
description = "GBA factory integration"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
clap.workspace = true
nerust_core_traits.workspace = true
nerust_gba_core.workspace = true
nerust_gba_device.workspace = true
nerust_gba_settings.workspace = true
nerust_input_traits.workspace = true
nerust_render_traits.workspace = true
nerust_settings_traits.workspace = true

[features]
# Test-harness log sink (mgba suite ROMs). Off by default; the
# headless ROM-test harness opts in. Production frontends never do.
mgba-debug-log = ["nerust_gba_core/mgba-debug-log"]
