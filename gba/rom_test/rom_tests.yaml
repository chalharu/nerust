rom_root: ../../roms/gba
suites:
  - name: jsmolka_gba-tests
    cases:
      # These aggregate ROMs leave the first failed test number in R12/R7.
      # Zero therefore means that every embedded instruction test completed.
      - id: jsmolka_arm
        rom: arm/arm.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
      - id: jsmolka_thumb
        rom: thumb/thumb.gba
        cycles: 1000000
        verify:
          registers:
            r7: 0x00
      - id: jsmolka_memory
        rom: memory/memory.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
      - id: jsmolka_ppu_hello
        rom: ppu/hello.gba
        cycles: 1000000
        verify:
          frame_pixels:
            - { x: 0, y: 0, color: 0x0000 }
            - { x: 73, y: 77, color: 0x7FFF }
            - { x: 80, y: 76, color: 0x0000 }
      - id: jsmolka_ppu_shades
        rom: ppu/shades.gba
        cycles: 1000000
        verify:
          frame_pixels:
            - { x: 0, y: 0, color: 0x0000 }
            - { x: 16, y: 0, color: 0x0800 }
            - { x: 32, y: 0, color: 0x1000 }
      - id: jsmolka_ppu_stripes
        rom: ppu/stripes.gba
        cycles: 1000000
        verify:
          frame_pixels:
            - { x: 0, y: 0, color: 0x560B }
            - { x: 8, y: 0, color: 0x6290 }
      - id: jsmolka_save_none
        rom: save/none.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
      - id: jsmolka_save_sram
        rom: save/sram.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
      - id: jsmolka_save_flash64
        rom: save/flash64.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
      - id: jsmolka_save_flash128
        rom: save/flash128.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
