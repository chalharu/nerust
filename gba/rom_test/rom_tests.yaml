  - id: PeterLemon_Velocity
    rom: Physics/2D/Velocity/Velocity.gba
    # Reproduction of the interacted reference state: hold shoulder-L for
    # 169 loop iterations (cannon rotation advances 256/frame; the release
    # lands one frame late by construction, so the effective angle is
    # 170 steps = 0xAA00), then B for one Control read (fires the bullet),
    # then 22 flight frames. Frame = 280896 T-cycles, loops phase-lock to
    # VBlank (release/press mid-frame at +140000 is safely between reads).
    # Result matches the reference except ~90 old-emu edge-rounding pixels
    # (neighboring-texel flips; our matrix/sampler match mGBA and the
    # HW-pinned $1234 check values). Stays in expected_failures.
    cycles: 54430048
    inputs:
    - {cycle: 0, buttons: [l]}
    - {cycle: 47808544, buttons: []}
    - {cycle: 48089440, buttons: [b]}
    - {cycle: 48470336, buttons: []}
  - id: PeterLemon_Acceleration
    rom: Physics/2D/Acceleration/Acceleration.gba
    # Reproduction of the interacted reference state: hold D-pad Left for
    # 48 loop iterations (car rotation advances 512/frame; effective angle
    # is 49 steps = 0x6200 by the same one-frame-late release). The car
    # never moves (no A/B), so rotation is the only degree of freedom.
    # Result matches except ~95 old-emu edge-rounding pixels (same class
    # as Velocity). Stays in expected_failures.
    cycles: 14381920
    inputs:
    - {cycle: 0, buttons: [left]}
    - {cycle: 13820128, buttons: []}
