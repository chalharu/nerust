expected_failures:
# nba_dma_burst_into_tears GRADUATED 3/3: the 16-bit GamePak read path
# pre-increments (dest[i] = mem16(src+2+2i), proven from the test's own
# main.c: 0x07FFFFFE inc -> 0x08000000 dec delivers ROM[2]/ROM[4] to
# OAM[0x3FE]/[0x3FC]) and the N/S state machine tracks the phantom bus
# stream (OAM-mirror -> ROM logical transition is a sequential ROM gap:
# TIME 43 -> 41). The shift fires only when the read lands in ROM
# (source or source+2 is GamePak); IWRAM 16-bit data stays exact per the
# nba latch test.
# nba_dma_force_nseq GRADUATED 2/2 (88/88 both subtests): single-unit
# non-ROM bursts complete with the unconditional completing tick only
# (no extra/tail ticks: those compensated the pre-Phase-A CPU model,
# which lacked the load/store fetch-stream-break charge; the suite
# Trivial DMA cells independently confirm +2 without them). The window
# is trigger-store + 4 post-trigger nops + return + TM0 read: the first
# nop costs 1N (DMA-pending bus arbitration N-ifies in-stream fetches),
# the rest ride the re-established stream, and the TM0-read ldrh carries
# the standard load post-body.
# nba_archive_irq_cancel_ie: rows 0,1,3,5,6,7 pass; rows 2 and 4 fail on
# 1-tick race boundaries that no uniform-latency model satisfies
# simultaneously with the pinned timer tests (start-stop 2/2, reload 7/7,
# start-delay 20 pin start latency = 2 and reload-load-on-enable). The
# delayed interrupt pipeline (IE/IF/IME apply +1, availability +1, CPU line
# +2, NBA hw/irq-verified, transitions queued so transient edges stay
# observable) fixed cancel-ime 8/8 and ie rows 0,1,3,5,6,7, but rows 2 and 4
# need per-row timer-overflow phases our fixed +6 (post-enable) cannot
# produce: with GBATEK-fixed CPU/bus costs the overflow tick, the IE-clear
# store landing, and the instruction boundaries coincide identically for
# rows that hardware decides oppositely (row 2 additionally depends on the
# stale counter freezing at FFFF, a 1-in-4 inter-row phase artifact of
# console/printf timing, not logic). True resolution needs that micro-state
# identified (sub-tick store-landing / entry-sampling research); do NOT
# re-break CPU timings or DMA fits to chase single rows.
- nba_archive_irq_cancel_ie
# nba_irq_delay: IWRAM reads 95 (HW 92, +3 over); EWRAM 112 and ROM 120
# still pass. The +3 is the NBA-verified IRQ-line propagation (+1 apply,
# +1 availability, +1 line... precisely +1/+1/+2 from the request) that the
# delayed interrupt pipeline adds before the CPU samples entry; IWRAM's
# fine-grained wait loop observes all of it while the coarser EWRAM/ROM
# loops absorb it into the same iteration-end boundary. A uniform HLE entry
# refit (23 -> 20) restores IWRAM to 92 but breaks EWRAM/ROM to 109/117
# (verified), so no uniform (entry, line-delay) pair fits all three ROM
# pins — the true fix is sub-tick entry overlap (countdown starting at IF
# with line gating at commit), which is future research. Accepted cost of
# the correct line delay that graduated cancel-ime 8/8; revisit together
# with cancel-ie rows 2/4.
- nba_irq_delay
