- name: mgba-suite
  cases:
  # Menu-driven multi-test ROM (mgba-emu/suite): each case navigates from
  # a fresh boot (DOWN taps + A), holds no buttons during the run, and
  # branches the suite's PASS:/FAIL: debug-log lines into per-subtest
  # checks. expected_checks lists subtests with reference-side or
  # research-grade causes (see notes); the mGBA debug MMIO backing this
  # is in GbaMemoryBus (0x04FFF600/700/780).
  - id: mgba_suite_memory
    rom: suite.gba
    description: mgba suite - Memory tests
    cycles: 1000000000
    skip_screenshot: true
    script:
    - {press: [a], until_log: 'BEGIN: Memory tests'}
    - {press: [], until_log: 'END:'}
    verify:
      suite_log:
        begin: 'BEGIN: Memory tests'
        end: 'END:'
        pass_prefix: 'PASS: '
        fail_prefix: 'FAIL: '
        sram: {fail_suffix: ': FAIL', header_infix: ' test: ', detail_infix: ': Got'}
    # 1502/1552 pass. The 50 below are reference-side or research-grade
    # (see §10): 38x stale ROM-mirror table, 10x HLE BIOS-content gap,
    # 2x open-bus latch micro-state (no uniform model).
    expected_checks:
    - 'ROM out-of-bounds load U8'
    - 'ROM out-of-bounds load S8'
    - 'ROM out-of-bounds load U16'
    - 'ROM out-of-bounds load U16 (unaligned)'
    - 'ROM out-of-bounds load S16'
    - 'ROM out-of-bounds load S16 (unaligned)'
    - 'ROM out-of-bounds load 32'
    - 'ROM out-of-bounds load 32 (unaligned 1)'
    - 'ROM out-of-bounds load 32 (unaligned 2)'
    - 'ROM out-of-bounds load 32 (unaligned 3)'
    - 'ROM out-of-bounds load DMA1 16'
    - 'ROM out-of-bounds load DMA1 16 (unaligned)'
    - 'ROM out-of-bounds load DMA1 32'
    - 'ROM out-of-bounds load DMA1 32 (unaligned 1)'
    - 'ROM out-of-bounds load DMA1 32 (unaligned 2)'
    - 'ROM out-of-bounds load DMA1 32 (unaligned 3)'
    - 'ROM out-of-bounds load DMA2 16'
    - 'ROM out-of-bounds load DMA2 16 (unaligned)'
    - 'ROM out-of-bounds load DMA2 32'
    - 'ROM out-of-bounds load DMA2 32 (unaligned 1)'
    - 'ROM out-of-bounds load DMA2 32 (unaligned 2)'
    - 'ROM out-of-bounds load DMA2 32 (unaligned 3)'
    - 'ROM out-of-bounds load DMA3 16'
    - 'ROM out-of-bounds load DMA3 16 (unaligned)'
    - 'ROM out-of-bounds load DMA3 32'
    - 'ROM out-of-bounds load DMA3 32 (unaligned 1)'
    - 'ROM out-of-bounds load DMA3 32 (unaligned 2)'
    - 'ROM out-of-bounds load DMA3 32 (unaligned 3)'
    - 'ROM out-of-bounds load swi B 16'
    - 'ROM out-of-bounds load swi B 16 (unaligned)'
    - 'ROM out-of-bounds load swi B 32'
    - 'ROM out-of-bounds load swi B 32 (unaligned 1)'
    - 'ROM out-of-bounds load swi B 32 (unaligned 2)'
    - 'ROM out-of-bounds load swi B 32 (unaligned 3)'
    - 'ROM out-of-bounds load swi C 32'
    - 'ROM out-of-bounds load swi C 32 (unaligned 1)'
    - 'ROM out-of-bounds load swi C 32 (unaligned 2)'
    - 'ROM out-of-bounds load swi C 32 (unaligned 3)'
    - 'BIOS load U8'
    - 'BIOS load S8'
    - 'BIOS load U16'
    - 'BIOS load U16 (unaligned)'
    - 'BIOS load S16'
    - 'BIOS load S16 (unaligned)'
    - 'BIOS load 32'
    - 'BIOS load 32 (unaligned 1)'
    - 'BIOS load 32 (unaligned 2)'
    - 'BIOS load 32 (unaligned 3)'
    - 'BIOS out-of-bounds load S16 (unaligned)'
    - 'Out-of-bounds load S16 (unaligned)'
  # The remaining mgba-suite groups are menu-driven (DOWN x N, A to run,
  # END logged, results viewer dismissed). Each case boots fresh, so the
  # menu always starts at index 0 (0 Memory, 1 I/O read, 2 Timing,
  # 3 Timer count-up, 4 Timer IRQ, 5 Shifter, 6 Carry, 7 Multiply long,
  # 8 BIOS math, 9 DMA, 10 SIO R/W, 11 SIO timing, 12 Misc edge,
  # 13 Video (interactive/visual: out of scope for log verify)).
  - id: mgba_suite_io_read
    rom: suite.gba
    description: mgba suite - I/O read tests
    cycles: 1000000000
    skip_screenshot: true
    script:
    - {press: [], wait_frames: 30}
    - {press: [down], wait_frames: 3}
    - {press: [a], until_log: 'BEGIN: I/O read tests'}
    - {press: [], until_log: 'END:'}
    verify:
      suite_log:
        begin: 'BEGIN: I/O read tests'
        end: 'END:'
        pass_prefix: 'PASS: '
        fail_prefix: 'FAIL: '
    # All subtests pass. The 12 APU readable-bit masks are applied at
    # write time (mGBA GBAIOWrite `value &= mask`; GBATEK R/W maps), so
    # unreadable bits never persist: e.g. SOUND1CNT_LO 0x007F,
    # SOUND3CNT_LO 0x00E0, SOUNDCNT_HI 0x770F. SOUNDCNT_X reads 0x0080
    # (master-enable latch; channel flags stay 0: the stub PSG never
    # runs). Pinned end-to-end by synthetic_apu_read_masks.
