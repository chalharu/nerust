        end: 'END:'
        pass_prefix: 'PASS: '
        fail_prefix: 'FAIL: '
    # 6 subtests fail on research-grade micro-behavior:
    # - "DMA Prefetch Break/Read": while an HBlank DMA3 runs, CPU
    #   reads from unmapped (0x10000000+) see DMA-bus bleed matching
    #   (value & 0xFFC0FFC0) == 0x40004000 until 0x10002A94, ending
    #   0xDEAD0000. Unmodeled bus-contention behavior (we return plain
    #   open bus, breaking at 0x10000004).
    # - "H-blank bit start Hblank/Flip 1-3": timer-measured HBlank
    #   flag edges (halt 0x4D0, rise 0x87, fall 0x3EC, rise 0xE5).
    #   Later flips (0x3EB/0xE3/0x3F3) pass; the first edges need
    #   exact flag/halt micro-timing (PPU Phase 8 follow-up).
    #   Traced (probes removed): both Halt wakes land exactly one line
    #   apart (1232), but the calibration read runs BEFORE its no-op
    #   master dispatch (+1) while the value read runs AFTER (+73),
    #   so Hblank measures 1232+72=1304 and Flip 1 runs +33. HW reads
    #   are symmetric (both post-dispatch, ~+105), forcing the first
    #   decision ahead of the calibration ldrh -- i.e. a ~2-tick faster
    #   PPU line -- while the shared line is pinned the opposite way
    #   by the timers ties (they need it slower) and irq-delay totals.
    #   Same sub-tick ceiling as the timers residuals: no uniform knob
    #   (line, entry, flag dots 1006/1232, halt charge) moves the two
    #   reads the required opposite directions; per-source staging
    #   lacks HW evidence. Flip 2/3 (+1/-2) are steady-state
    #   poll-phase jitter on top. Research-grade.
    #   H-BLANK UPDATE (Halt dispatch-before-resume, from the SIO work;
    #   Got re-measured, no code change here): Hblank +79 -> +3 (0x4D3 v
    #   0x4D0), Flip 1 +25 -> -7 (0x80 v 0x87); Flip 2/3 unchanged
    #   (+1/-2). With the wake dispatch running, both Halt wakes cost
    #   the same, so the old calibration/value asymmetry is gone and the
    #   measures are near-symmetric. Residuals are still opposite-
    #   direction pairs (+3/-7/+1/-2) with no uniform knob (the line is
    #   pinned the other way by the timers ties): still research-grade,
    #   revisit only with sub-tick evidence.
    #   DMA PREFETCH PAIR: attempted, mechanism understood, research-grade
    #   (no code change, tree clean; Got re-measured: Break 0x10000004 v
    #   0x10002A94, Read 0x00004003 v 0xDEAD0000):
    #   - mGBA HAS a bleed model (GBALoadBad: performingDMA -> gba->bus),
    #     but it fires only DURING the transfer burst; our DMA is
    #     burst-atomic between instructions (system.rs cpu-stall), so the
    #     flag could never be true at a CPU read -- structurally
    #     inexpressible without a per-cycle DMA/CPU interleave remodel
    #     (which the force-nseq/burst-into-tears/128kb/DMA-1244 pins
    #     forbid touching).
    #   - External evidence: neser passes Read via a canned
    #     is_mgba_misc_edge_dma_prefetch_pattern() match (exact DMA3
    #     HBlank/repeat/fixed/count==1 shape -> 0xDEAD0000) -- per-test
    #     fitting of exactly the class our per-ROM-branch ban forbids;
    #     VBA-M passes Break via a per-cycle bus-state sim + per-suite-
    #     build reference tables (trigger-to-grant latency calibrated
    #     per build).
    #   - Break==0x10002A94 exact is a cycle-count measurement over 2724
    #     iterations: hitting it needs cycle-exact CPU (Timing 76 open)
    #     to <1/2724 precision -- same sub-tick ceiling as timers; even
    #     a perfect latch leaves the count to lottery.
    #   - Prereq is the per-cycle CPU remodel (DIFFERENT-MODEL SURVEY
    #     direction), not a bus tweak. Do NOT pattern-match the DMA
    #     config or hardcode counts; do NOT retune open-bus globally
    #     (memory 1502 at risk).
    #   LATCH HYPOTHESIS FALSIFIED (analysis only, no code change):
    #   a DMA bus latch (mGBA-shaped `gba->bus` = last source data,
    #   served on post-unit unmapped reads) cannot fix either cell:
    #   - The loop starts post-VBlankIntrWait; the first HBlank unit
    #     lands ~900 ticks later while loop iterations cost ~15-30 ticks,
    #     so iterations 0-40 run PRE-first-unit — yet HW bleeds through
    #     them (breaks at 2724, not 0). Bleed therefore does NOT require
    #     a prior unit; a post-unit latch breaks at iter 0 either way
    #     (latch 0xDEAD or open bus, both != pattern) and can never reach
    #     the Read fix either (Read's Got comes from the iter-0 break,
    #     pre-unit, open bus — identical with or without latch).
    #   - The bleed VALUE is underivable: no DMA state (SAD/DAD/CNT are
    #     EWRAM/0x8401-ish) masks to (v&0xFFC0FFC0)==0x40004000, and
    #     mGBA's own bus=latch (source data) doesn't match the pattern
    #     either — sustained armed-bleed needs bus-electrical facts no
    #     emulator source records. Interleave is equally dead for the
    #     count (1 unit/line has no between-units gap for the CPU).
    #   Both sub-hypotheses dead; the pair stays boxed as phase-lottery
    #   (Break) + unknowable-value (Read/bleed).
    #   H-BLANK 4 RECONFIRMED (Got re-measured): Hblank +79 (0x51F v
    #   0x4D0), Flip1 +25 (0xA0 v 0x87) -- both need a FASTER line/wake,
    #   opposite to timers (needs slower): direct contradiction on
    #   shared knobs. Flip2 +1 / Flip3 -2 need OPPOSITE directions with
    #   Flip4/5/6 exact pinning the poll cost: multi-direction
    #   impossibility. Boxed; revisit only with sub-tick evidence.
    expected_checks:
    - 'DMA Prefetch Break'
    - 'DMA Prefetch Read'
    - 'H-blank bit start Hblank'
    - 'H-blank bit start Flip 1'
    - 'H-blank bit start Flip 2'
    - 'H-blank bit start Flip 3'
