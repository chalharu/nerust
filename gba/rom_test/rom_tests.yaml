rom_root: ../../roms/gba
expected_failures:
# nba_dma_burst_into_tears GRADUATED 3/3: the 16-bit GamePak read path
# pre-increments (dest[i] = mem16(src+2+2i), proven from the test's own
# main.c: 0x07FFFFFE inc -> 0x08000000 dec delivers ROM[2]/ROM[4] to
# OAM[0x3FE]/[0x3FC]) and the N/S state machine tracks the phantom bus
# stream (OAM-mirror -> ROM logical transition is a sequential ROM gap:
# TIME 43 -> 41). The shift fires only when the read lands in ROM
# (source or source+2 is GamePak); IWRAM 16-bit data stays exact per the
# nba latch test.
# nba_dma_force_nseq GRADUATED 2/2 (88/88 both subtests): single-unit
# non-ROM bursts complete with the unconditional completing tick only
# (no extra/tail ticks: those compensated the pre-Phase-A CPU model,
# which lacked the load/store fetch-stream-break charge; the suite
# Trivial DMA cells independently confirm +2 without them). The window
# is trigger-store + 4 post-trigger nops + return + TM0 read: the first
# nop costs 1N (DMA-pending bus arbitration N-ifies in-stream fetches),
# the rest ride the re-established stream, and the TM0-read ldrh carries
# the standard load post-body.
# nba_archive_irq_cancel_ie: rows 0,1,3,5,6,7 pass; rows 2 and 4 fail on
# 1-tick race boundaries that no uniform-latency model satisfies
# simultaneously with the pinned timer tests (start-stop 2/2, reload 7/7,
# start-delay 20 pin start latency = 2 and reload-load-on-enable). The
# delayed interrupt pipeline (IE/IF/IME apply +1, availability +1, CPU line
# +2, NBA hw/irq-verified, transitions queued so transient edges stay
# observable) fixed cancel-ime 8/8 and ie rows 0,1,3,5,6,7, but rows 2 and 4
# need per-row timer-overflow phases our fixed +6 (post-enable) cannot
# produce: with GBATEK-fixed CPU/bus costs the overflow tick, the IE-clear
# store landing, and the instruction boundaries coincide identically for
# rows that hardware decides oppositely (row 2 additionally depends on the
# stale counter freezing at FFFF, a 1-in-4 inter-row phase artifact of
# console/printf timing, not logic). True resolution needs that micro-state
# identified (sub-tick store-landing / entry-sampling research); do NOT
# re-break CPU timings or DMA fits to chase single rows.
- nba_archive_irq_cancel_ie
# nba_irq_delay: IWRAM reads 95 (HW 92, +3 over); EWRAM 112 and ROM 120
# still pass. The +3 is the NBA-verified IRQ-line propagation (+1 apply,
# +1 availability, +1 line... precisely +1/+1/+2 from the request) that the
# delayed interrupt pipeline adds before the CPU samples entry; IWRAM's
# fine-grained wait loop observes all of it while the coarser EWRAM/ROM
# loops absorb it into the same iteration-end boundary. A uniform HLE entry
# refit (23 -> 20) restores IWRAM to 92 but breaks EWRAM/ROM to 109/117
# (verified), so no uniform (entry, line-delay) pair fits all three ROM
# pins — the true fix is sub-tick entry overlap (countdown starting at IF
# with line gating at commit), which is future research. Accepted cost of
# the correct line delay that graduated cancel-ime 8/8; revisit together
# with cancel-ie rows 2/4.
- nba_irq_delay
# nba_archive_irq_cancel_ime GRADUATED 8/8 by the delayed interrupt
# pipeline (see cancel-ie note) and is no longer listed here. It used to
# fail only on row i=0 because the once-per-instruction entry check sampled
# immediate IE/IF/IME and always saw the not-yet-cleared IME; the +1/+1/+2
# propagation lets the IME-clear store land first, matching hardware.
# The three affine cases below fail on REFERENCE STATE, not emulation: the
# affine pipeline is verified correct three independent ways — (1) the ROMs'
# real-HW check values ($1234: pa=0xE7/pb=0xFF93/pc=0x6D/pd=0xE7) pass in
# BIOSBGAFFINESET/BIOSOBJAFFINESET, (2) register-driven rotation demos
# (OBJRotZoom4/8BPP, BGRotZoomMode3/4/5) match their refs, (3) a full-frame
# GBATEK-model resimulation of BGRotZoomMode2 defaults matches our render
# bit-exact (0 diff pixels). The shipped .png refs show INTERACTED states the
# no-input harness can never reach: BGRotZoomMode2 zoomed-out (~0.55x, no
# rigid zoom/pan reproduces it), Velocity/Acceleration with rotated sprites
# (angle 0 at rest renders correctly; the bullet is then exactly occluded by
# the cannon) plus old-emu colors (whole-frame off-white). The input harness
# already supports every button (A/B/L/R/directions); only the exact
# interaction sequences were missing. Velocity (169xL + B + 22 flights) and
# Acceleration (48xLeft) now drive their reference states (see per-case
# comments) and bottom out at ~90 old-emu edge-rounding pixels
# (neighboring-texel flips; matrix and sampler match mGBA plus the HW-pinned
# $1234 values, and a round-half-up experiment made it strictly worse:
# 95 -> 850). BGRotZoomMode2 has no reproducible rigid state (full-screen
# affine: edge noise would dominate anyway).
- PeterLemon_BGRotZoomMode2
- nba_archive_ppu_exact_timing
# The 8 image cases below ship PHOTOGRAPHS of real hardware as reference
# (4000x3000 etc., never 240x160), so the harness fails them on dimensions
# before any pixel is compared: no emulator rendering can pass. Their PPU
# mechanisms are fixed and verified separately (OBJ-live enables, affine
# enable-gating, forced-blank restart, mid-line DMA visibility proven via
# targeted probes; structured outputs confirmed sane).
- nba_archive_ppu_mode2
- nba_archive_ppu_mode3
- nba_archive_ppu_mode4
- nba_haltcnt
- nba_ppu_bgpd
- nba_ppu_bgx
- nba_ppu_dispcnt_latch
- nba_ppu_greenswap
- nba_ppu_ram_access_timing
- nba_ppu_sprite_hmosaic
- nba_ppu_status_irq_dma
- PeterLemon_FastLine
- PeterLemon_FastLineClip
# PeterLemon_Timers: REFERENCE-STATE, not emulation. The shipped .png is
# mutually inconsistent with a single 3M-cycle snapshot of the shipped ROM
# with reload 0: TM1=$CB64 needs 3.33M ticks, TM2=$F252 needs 15.9M,
# TM3=$BCA5 needs 49.5M (verified by decoding the ref digits against the
# ROM font). Our counters are internally exact (TM0/1/2/3 at 3M read
# 0x6784/0xB19E/0x2C67/0x0B1A: one consistent S~=90K enable epoch, loss 2,
# divider phases coherent). Regenerate the ref with an hw-validated build;
# do not fit the timer model to impossible values.
- PeterLemon_Timers
- PeterLemon_GRB12LZDIFFRLEVideo
- PeterLemon_Rickroll
- PeterLemon_GRB15LZVideo
- PeterLemon_GRB12LZVideo
- PeterLemon_GRB12LZIPSVideo
- PeterLemon_DevoTimeOutForFun
- PeterLemon_GRB15LZIPSVideo
- PeterLemon_TouhouBadApple
- PeterLemon_BigBuckBunny
- PeterLemon_3DEngine
- PeterLemon_CylinderMap
# Velocity/Acceleration: see the affine note above (interacted refs).
- PeterLemon_Velocity
- PeterLemon_Acceleration
# mgba_suite_timing: whole-case research-grade (1030/1244 subtests fail).
# The suite measures instruction/bus cycle counts over prefetch (P),
# N/S-wait (N/S) and region combinations against HW captures; our bus
# timing model differs systematically (calibration itself already
# mismatches, shifting every downstream measurement). Enumerating 1030
# check names would bury the signal; the checks still run and report,
# and the case flips to unexpected-pass when a timing overhaul lands.
# See the suite's timing.c calibration + P/N/S matrix.
- mgba_suite_timing
# mgba_suite_timers: EXPECTED-FAIL (reaches END since the stale-tick
# gate; 401/936). History: quarantined hang (never reached END),
# root-caused to two ~1-cycle dispatch-ordering windows ("HW dispatch
# wins a race our staged IRQ pipeline loses"):
# - WAKE window (FIXED): the HLE IntrWait returns inline (zero cycles),
#   so the woken thread stores `irqCounter = ii` before the just-raised
#   IRQ line finishes staging (+2 after apply). On HW the real BIOS
#   IntrWait exit path (~10+ cycles) always loses that race, so the wake
#   dispatch consumes the prologue counter first. Fixed by `wake_latency`
#   (memory.rs/system.rs): an IntrWait-armed wake burns 8 CPU-stall
#   cycles (time still advances, line stages during the burn), forcing
#   dispatch-before-resume deterministically.
# - START-DELAY window (FIXED differently than first theorized): the hang
#   was NOT the HW-real stale overflow losing a dispatch race (that race
#   is unfittable within pin constraints -- see post-mortems below), but
#   a SPURIOUS stale overflow our model fabricated: the start-delay tick
#   unconditionally incremented the stale counter, so every prescaled or
#   count-up TM0 re-enable with a 0xFFFF stale raised a +1 overflow IRQ
#   HW never produces. The suite reuses TM0 across prescalers (0b -> 6b
#   -> 8b -> 10b), so these phantom dispatches killed staging timers and
#   stranded IntrWait. Fixed by gating the stale tick on the prescaler
#   tap (fires this tick only; count-up enables load outright), faithful
#   to nba OnControlWritten / issue #331 (timer.rs handle_start_delay).
#   /1 behavior is unchanged (tap fires every tick), so the nba
#   tick-before-reload pin (IF.3 + TM1 cascade) still holds, as do
#   start-stop, reload, irq-delay, cancel-ime/if and the Timing cells
#   (full manifest 122/123 identical, PhaseF->PhaseH).
#   POST-MORTEM (structural redesign attempted and REVERTED): separating
#   register-settle (pending apply +1, kept) from line-sample
#   (avail/line queues removed, combinatorial; IRQ_ENTRY 23->25 to hold
#   irq-delay totals) preserves cancel-ime 8/8 (row BOOLs come from
#   same-tick coalescing in the single pending slot, not queue order)
#   but structurally regresses irq-delay EWRAM/ROM (112/120 lost, no
#   entry value 25-27 recovers them) and cancel-ie rows (246->369px,
#   entry-invariant): with zero net wall-time shift, the earlier
#   preemption point still flips +-1-margin rows, and some dispatch
#   paths break beyond arithmetic. Uniform models cannot satisfy the
#   timers windows and the cancel/irq-delay pins at once; the
#   conflicting evidence needs a new model dimension, not a rebalance.
#   POST-MORTEM 2 (sub-tick trial: combinatorial line + entry 25, also
#   REVERTED): the suite DOES flow under it (END reached, 380/936 pass)
#   -- proving the races are winnable -- but residuals are unfittable
#   uniformly and the pin cost stands (irq-delay EWRAM/ROM, cancel-ie
#   rows). Superseded by the stale-tick gate (401/936, zero pin cost).
#   RESIDUALS (535, all d/i-independent and delay-row-independent for
#   0b): tight sums run one poll short (0x0005 2v3, 0x000D 3v4; 0x0001
#   passes at the floor), loose sums halve exactly when HW fits 2 polls
#   (0x000C/0x000D 16xs 0x10v0x20), values drift +-1..6 with mixed signs
#   (roundtrip-mod-reload-period aliasing). Same +-1-3 systematic class
#   as the Timing 76; no uniform knob fits without breaking the
#   irq-delay/cancel pins. Next step is a cycle trace of one cell (e.g.
#   0b,0x0005 1d1i tight: enable/overflow/stop/dispatch stamps vs the
#   poll-loop cost), not another global rebalance. Do NOT retune timer
#   phase/charges/staging or fit IntrWait timing to chase single cells.
#   TRACE FINDINGS (cycle-attributed via activeTestInfo testId/phase,
#   probes since removed): the tight loop costs P=8 (GBATEK-exact
#   1+3+1+3, so loop cost is NOT the error). For 0b,0x0005 (period 5)
#   the 2nd poll read and the first storm dispatch tie at the same
#   instruction-boundary tick and dispatch structurally wins the tie
#   (service_irq runs before cpu.step), giving 2v3; for 0b,0x000C
#   (period 12) the 2nd read beats the dispatch, giving 3v3. Values pin
#   X=(stopApply-firstOvf) to X=4 mod 5 (0x0005) and X=10 mod 12
#   (0x000C) on the IDENTICAL path, while the model yields 93 and 94:
#   0x000C already satisfies X=34 mod 60 and any uniform shift breaks
#   it, and the loop is already at ~1 cycle/insn (no shaveable floor).
#   EXPERIMENT (line+1/entry-1, total-preserving, REVERTED): sums +24
#   (all 0x000D/0x0024/0x0080 loose-halves complete -- unifying tight-1
#   and loose-half as preemption ties) but values -14 by boundary-slip
#   lottery (decision slips a full 5-cycle LDR past the tie, walking
#   residues mod p), the irq-delay check value moved, and cancel-ie
#   first-diff-pixel moved (count still 246). Uniform knobs are now
#   exhaustively closed (entry, line, staging, start-delay,
#   stop-deferral, P-floor): what remains is phase-dependent decision
#   quantization or a cycle-exact CPU, both research-grade.
- mgba_suite_timers

