      # bit-exact (32-bit wrap on every add/sub/mul).
      - {address: 0x02000000, value: 0x007B, width: 2}
      - {address: 0x02000022, value: 0x003D, width: 2}
      - {address: 0x02000042, value: 0x0032, width: 2}
