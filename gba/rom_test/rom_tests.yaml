- name: nba-emu_hw-test
  cases:
  - id: nba_dma_start_delay
    rom: dma/start-delay/start-delay.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x030001C4, value: 1, width: 4}
      - {address: 0x030001C8, value: 1, width: 4}
  - id: nba_dma_latch
    rom: dma/latch/latch.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x0300014C, value: 4, width: 4}
      - {address: 0x03000150, value: 4, width: 4}
  - id: nba_timer_reload
    rom: timer/reload/reload.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x03000424, value: 7, width: 4}
      - {address: 0x03000428, value: 7, width: 4}
  - id: nba_timer_start_stop
    rom: timer/start-stop/start-stop.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x03000264, value: 2, width: 4}
      - {address: 0x03000268, value: 2, width: 4}
  - id: nba_timer_tick_before_reload
    rom: timer/tick-before-reload/tick-before-reload.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x03000284, value: 2, width: 4}
      - {address: 0x03000288, value: 2, width: 4}
  # --- additional nba-emu tests (Phase 8/8.5 - PPU/DMA/Bus/IRQ) ---
  - id: nba_irq_delay
    rom: irq/irq-delay/irq-delay.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x030003E8, value: 3, width: 4}
      - {address: 0x030003EC, value: 3, width: 4}
  - id: nba_haltcnt
    rom: haltcnt/haltcnt.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x030004EC, value: 6, width: 4}
      # Status (all values HW-pinned): DIRECT 12 PASS, CPUSET 4157 (HW 4155:
      # +2 over — the post-HALT-wake ROM resume fetch pays N=5; GBATEK/mGBA
      # mandate N=1+4, so the offset lives in the fitted HLE CpuSet phases
      # (Setup 61/Return 46, fitted under the old N=4) and needs HW-anchored
      # HLE refit, not a timing revert), POSTFLG PASS, CPUSET-DMA 4154
      # (HW 4154: EXACT — halt wake on the effective IE/IF registers, per
      # GBATEK Halt "paused while (IE AND IF)=0", restores the phase the
      # delayed-availability wake had shifted by +2), TIME-IWRAM 125 PASS,
      # TIME-ROM 245 (HW 249: -4, narrowed from -10 by GBATEK-correct ROM
      # fetch costs). Listed in expected_failures until the HLE phases are
      # HW-anchored.
      # ADDENDUM (Halt-wake burn, from the SIO work): plain-Halt wakes
      # burn only with IME=1 (dispatch may follow); with IME=0 (as here:
      # cpu_irq_disable + REG_IME=0, so no dispatch is possible) the wake
      # stays free, preserving CPUSET-DMA 4154 exact. Verified 5/6 both
      # before and after.
      - {address: 0x030004F0, value: 6, width: 4}
  - id: nba_ppu_bgpd
    rom: ppu/bgpd/bgpd.gba
    cycles: 3000000
  - id: nba_ppu_sprite_hmosaic
    rom: ppu/sprite-hmosaic/sprite-hmosaic.gba
    cycles: 3000000
  - id: nba_ppu_status_irq_dma
    rom: ppu/status-irq-dma/status-irq-dma.gba
    cycles: 3000000
  - id: nba_ppu_bgx
    rom: ppu/bgx/bgx.gba
    cycles: 3000000
  - id: nba_ppu_dispcnt_latch
    rom: ppu/dispcnt-latch/dispcnt-latch.gba
    cycles: 3000000
  - id: nba_ppu_greenswap
    rom: ppu/greenswap/greenswap.gba
    cycles: 3000000
  - id: nba_ppu_vram_mirror
    rom: ppu/vram-mirror/vram-mirror.gba
    cycles: 60000000
    verify:
      memory:
      - {address: 0x030003F4, value: 0x0A, width: 4}
      - {address: 0x030003F8, value: 0x0A, width: 4}
  - id: nba_ppu_ram_access_timing
    rom: ppu/ram-access-timing/ram-access-timing.gba
    cycles: 3000000
  - id: nba_dma_burst_into_tears
    rom: dma/burst-into-tears/burst-into-tears.gba
    cycles: 3000000
    verify:
      memory:
      # Graduated 3/3 (see header note): pre-increment 16-bit GamePak reads
      # plus phantom-stream N/S give values and TIME 41 exactly.
      - {address: 0x03000234, value: 3, width: 4}
      - {address: 0x070003FE, value: 0xEA00, width: 2}
      - {address: 0x070003FC, value: 0xFF24, width: 2}
      - {address: 0x03000238, value: 3, width: 4}
  - id: nba_dma_force_nseq
    rom: dma/force-nseq-access/force-nseq-access.gba
    cycles: 3000000
    verify:
      memory:
      # Counters (this .gba's layout; the stale .elf disagrees): test_count
      # @0x0300014C (=2, both subtests run), test_pass_count @0x03000150
      # (=2: both read 88/88 with the single-unit finalization tail;
      # 87/87 with completing+extra only, 86/86 before that). The +16/+17
      # gap closed via GBATEK-correct costs: 16-bit ROM N/S +1 base (CPU
      # and DMA paths), Thumb POP-PC refill, per-tick timestamp
      # decomposition, N/S fetch+data stream split, the single-unit
      # non-ROM completion tail (mGBA/NBA-conformant), and the single-unit
      # finalization tick (elimination-pinned: the only force-unique
      # window element; see header note and completion_tail_single).
      # A per-burst +2 (mGBA dma.c completion term) was tried and
      # reverted: it fixes force-nseq but breaks all 12 exact 128kb fits
      # (our front-loaded xI already carries those 2 cycles).
      - {address: 0x0300014C, value: 2, width: 4}
      - {address: 0x03000150, value: 2, width: 4}
  - id: nba_bus_128kb_boundary
    rom: bus/128kb-boundary/128kb-boundary.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x030003DC, value: 0x12, width: 4}
      - {address: 0x030003E0, value: 0x12, width: 4}
  - id: nba_archive_irq_cancel_ie
    rom: archive/irq/cancel-irq-ie/cancel-irq-ie.gba
    cycles: 3000000
  - id: nba_archive_irq_cancel_if
    rom: archive/irq/cancel-irq-if/cancel-irq-if.gba
    cycles: 3000000
  - id: nba_archive_irq_cancel_ime
    rom: archive/irq/cancel-irq-ime/cancel-irq-ime.gba
    cycles: 3000000
  - id: nba_archive_ppu_mode4
    rom: archive/ppu/mode4/mode4.gba
    cycles: 3000000
  - id: nba_archive_ppu_exact_timing
    rom: archive/ppu/exact-timing/exact-timing.gba
    cycles: 20000000
    verify:
      memory:
      # Currently 6/7 (was 4/7): HBL-SET/UNSET + VCNT-FLAG/CHANGE
      # (500/613/613/613), HBL-DMA 502 and HBL-IRQ 501 all pass. Three
      # NBA-grounded fixes landed for them: (1) video request countdown
      # 2->3 (NBA PPU.cc `UpdateVideoTransferDMA` schedules `PPU_VideoDMA`
      # +3; mGBA `GBADMARunDisplayStart` starts video DMA `now + 3`);
      # (2) DMA3 video-capture first units skip the burst-start xI (their
      # xI is absorbed pre-start, giving the uniform 2/unit rhythm the
      # HBL-DMA TM0 sweep pins: a first interval of 4 would trip it at
      # index 1; every other channel keeps the xI, pinned by force-nseq
      # 88/88); (3) HBlank IF raises a tick after the DISPSTAT flag edge
      # (NBA schedules `PPU_HBlankIRQ` +1; the flag-edge DMA sample stays
      # clear, the next sees IF). Native pins in dma_fit.rs
      # (`video_sample_flag_edges`, `video_sample_if_edge`).
      # DMA3-XFER alone stays out (0x52D1 vs 0x52D3, +2): the video phase
      # is locked at R0=6 by the six passing cells (no uniform shift fits
      # all), the VCOUNT edge is locked at line end by VCNT-CHANGE=613,
      # and the residual is a diffuse +2 over the 10-instruction TM0-start
      # setup sum (ours 21 from edge to start, HW 19; P-OFF, so no
      # prefetch-erase involvement; no single rule violation found —
      # STR32-IO=2 is GBATEK-correct 2N at 1cy/access). Fixing it needs
      # per-instruction HW truth for that path; revisit with
      # per-cycle-CPU HW pins, not by fitting.
      - {address: 0x0300062C, value: 7, width: 4}
      - {address: 0x03000630, value: 7, width: 4}
  - id: nba_archive_ppu_mode3
    rom: archive/ppu/mode3/mode3.gba
    cycles: 3000000
  - id: nba_archive_ppu_mode2
    rom: archive/ppu/mode2/mode2.gba
    cycles: 3000000
  - id: nba_archive_ppu_basic_timing
    rom: archive/ppu/basic-timing/basic-timing.gba
    cycles: 3000000
    verify:
      memory:
      - {address: 0x03000EA4, value: 6, width: 4}
      - {address: 0x03000EA8, value: 6, width: 4}
