- name: armwrestler-gba-fixed
  cases:
  - id: armwrestler_arm_alu
    description: ARM ALU instruction tests via menu item 0
    rom: armwrestler-gba-fixed.gba
    cycles: 4000000
    inputs:
      - {cycle: 100000, buttons: [start]}
      - {cycle: 480000, buttons: []}
    verify:
      frame_pixels:
      - {x: 0, y: 0, color: 0x0000}
      - {x: 65, y: 72, color: 0x7FFF}

  - id: armwrestler_arm_ldr_str
    description: ARM LDR/STR instruction tests via menu item 1
    rom: armwrestler-gba-fixed.gba
    cycles: 5000000
    inputs:
      - {cycle: 100000, buttons: [down]}
      - {cycle: 300000, buttons: []}
      - {cycle: 480000, buttons: [start]}
      - {cycle: 660000, buttons: []}
    verify:
      frame_pixels:
      - {x: 0, y: 0, color: 0x0000}
      - {x: 65, y: 72, color: 0x7FFF}

  - id: armwrestler_arm_ldm_stm
    description: ARM LDM/STM instruction tests via menu item 2
    rom: armwrestler-gba-fixed.gba
    cycles: 6000000
    inputs:
      - {cycle: 100000, buttons: [down]}
      - {cycle: 300000, buttons: []}
      - {cycle: 480000, buttons: [down]}
      - {cycle: 660000, buttons: []}
      - {cycle: 760000, buttons: [start]}
      - {cycle: 940000, buttons: []}
    verify:
      frame_pixels:
      - {x: 0, y: 0, color: 0x0000}
      - {x: 65, y: 72, color: 0x7FFF}

  - id: armwrestler_thumb_alu
    description: THUMB ALU instruction tests via menu item 3
    rom: armwrestler-gba-fixed.gba
    cycles: 7000000
    inputs:
      - {cycle: 100000, buttons: [down]}
      - {cycle: 300000, buttons: []}
      - {cycle: 480000, buttons: [down]}
      - {cycle: 660000, buttons: []}
      - {cycle: 760000, buttons: [down]}
      - {cycle: 940000, buttons: []}
      - {cycle: 1040000, buttons: [start]}
      - {cycle: 1220000, buttons: []}
    verify:
      frame_pixels:
      - {x: 0, y: 0, color: 0x0000}
      - {x: 65, y: 72, color: 0x7FFF}

  - id: armwrestler_thumb_ldr_str
    description: THUMB LDR/STR instruction tests via menu item 4
    rom: armwrestler-gba-fixed.gba
    cycles: 8000000
    inputs:
      - {cycle: 100000, buttons: [down]}
      - {cycle: 300000, buttons: []}
      - {cycle: 480000, buttons: [down]}
      - {cycle: 660000, buttons: []}
      - {cycle: 760000, buttons: [down]}
      - {cycle: 940000, buttons: []}
      - {cycle: 1040000, buttons: [down]}
      - {cycle: 1220000, buttons: []}
      - {cycle: 1320000, buttons: [start]}
      - {cycle: 1500000, buttons: []}
    verify:
      frame_pixels:
      - {x: 0, y: 0, color: 0x0000}
      - {x: 65, y: 72, color: 0x7FFF}

  - id: armwrestler_thumb_ldm_stm
    description: THUMB LDM/STM instruction tests via menu item 5
    rom: armwrestler-gba-fixed.gba
    cycles: 9000000
    inputs:
      - {cycle: 100000, buttons: [down]}
      - {cycle: 300000, buttons: []}
      - {cycle: 480000, buttons: [down]}
      - {cycle: 660000, buttons: []}
      - {cycle: 760000, buttons: [down]}
      - {cycle: 940000, buttons: []}
      - {cycle: 1040000, buttons: [down]}
      - {cycle: 1220000, buttons: []}
      - {cycle: 1320000, buttons: [down]}
      - {cycle: 1500000, buttons: []}
      - {cycle: 1600000, buttons: [start]}
      - {cycle: 1780000, buttons: []}
    verify:
      frame_pixels:
      - {x: 0, y: 0, color: 0x0000}
      - {x: 65, y: 72, color: 0x7FFF}
