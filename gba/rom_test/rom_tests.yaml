    # 90/90 subtests pass (GRADUATED). SIO register file, all derived
    # from the suite HW table (sio-read.c) + GBATEK R/W maps, with mGBA
    # (sio.c/io.c) as mechanism reference where it matches HW:
    # - SIOCNT write masks per sub-mode (mGBA `& 0x7FFF` for bit 15):
    #   multi `& 0xFF83` + slave (unconnected unit is a Child) + ID 0 +
    #   Ready + old RO-bit retain; normal `& ~0x8070` + SI forced high
    #   (no partner); UART `& ~0x8050` (Send-Full/Error read 0 idle,
    #   Receive-Empty reads 1); GPIO/Joybus keep the SIOCNT sub-format.
    # - RCNT: mode bits + {4-8} latch at write; data pins {0-3} are live
    #   at read (multi/UART float high 0xF, normal SC+SI high 0x5);
    #   GPIO latches {0-8}, Joybus latches {2-8} (SC/SD read 0).
    # - JOYCNT uses the mGBA formula (0xFFFF -> 0x0040 from reset).
    # - Data regs: 0x120/0x122 latch only in Normal-32 SIO mode (send);
    #   0x12A latches except in UART (empty receive FIFO reads 0);
    #   SIOMULTI2/3, JOY_RECV/TRANS and JOYSTAT read 0 with no transfer.
    # - Unconnected multi is a SLAVE: START never schedules (the suite's
    #   Multi timing tests rely on this to time out into self-SKIP), so
    #   no transfer completion can clobber later subtests.
    # - Where mGBA diverges from the HW table, the table rules (UART
    #   SIODATA8, JOY TRANS/STAT, G/J SIOCNT, RCNT data bits): mGBA does
    #   not fully pass its own newer suite ROM.
