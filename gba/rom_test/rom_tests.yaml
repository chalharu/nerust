rom_root: ../../roms/gba
expected_failures:
# Box verdicts live in nerust-docs/reference/gba/gba-rom-test-box-verdicts.md
# (§N pointers below). Yaml keeps status + one-line mechanism only.
# nba_dma_burst_into_tears GRADUATED 3/3 (see §1): 16-bit GamePak reads
# pre-increment (dest[i] = mem16(src+2+2i)); N/S tracks the phantom bus
# stream; fires only when the read lands in ROM.
# nba_dma_force_nseq GRADUATED 2/2 (88/88, see §1): single-unit non-ROM
# bursts complete with the unconditional completing tick only; window =
# trigger-store + 4 nops + return + TM0 read (first nop 1N arbitration).
# nba_archive_irq_cancel_ie (see §2): rows 0,1,3,5,6,7 pass; rows 2 and 4
# fail on 1-tick race boundaries (row 2 needs a stale-FFFF phase artifact
# of printf timing, not logic). Do NOT re-break CPU/DMA fits for them.
- nba_archive_irq_cancel_ie
# nba_irq_delay (see §2): IWRAM 95 vs HW 92 (+3 line propagation the fine
# loop observes; EWRAM 112 / ROM 120 pass). No uniform (entry, line-delay)
# pair fits all three; true fix is sub-tick entry overlap (research).
- nba_irq_delay
# nba_archive_irq_cancel_ime GRADUATED 8/8 by the delayed interrupt
# pipeline (+1/+1/+2; see §1-2).
# Affine refs fail on REFERENCE STATE, not emulation (see §3): $1234
# checks pass, GBATEK resimulation bit-exact; shipped PNGs show
# uninteractible states (0.55x zoom; rotated sprites + old-emu colors).
# Velocity (169xL + B + 22 flights) and Acceleration (48xLeft) drive their
# states and bottom out at ~90 old-emu edge-rounding pixels (round-half-up
# made it worse: 95 -> 850). BGRotZoomMode2 has no reproducible rigid state.
- PeterLemon_BGRotZoomMode2
- nba_archive_ppu_exact_timing
# Photo refs (see §3): dimensions fail before pixels (4000x3000 vs 240x160).
# PPU mechanisms verified separately (OBJ-live, affine gating, blank
# restart, mid-line DMA visibility).
- nba_archive_ppu_mode2
- nba_archive_ppu_mode3
- nba_archive_ppu_mode4
- nba_haltcnt
- nba_ppu_bgpd
- nba_ppu_bgx
- nba_ppu_dispcnt_latch
- nba_ppu_greenswap
# nba_ppu_status_irq_dma / nba_ppu_ram_access_timing are INTERACTIVE with
# no headless hooks (see §3). Covered natively (dma_fit irq/phase/latch/
# access pins; IF pins need libgba IntrMain's ack — ROM-drive only).
# Revisit only with a recorded input sequence plus a long-run harness mode.
- nba_ppu_ram_access_timing
- nba_ppu_sprite_hmosaic
- nba_ppu_status_irq_dma
- PeterLemon_FastLine
- PeterLemon_FastLineClip
# PeterLemon_Timers (see §3): ref mutually inconsistent with one 3M-cycle
# snapshot (TM1 $CB64 needs 3.33M ticks etc.). Ours internally exact.
# Regenerate with an hw-validated build; never fit timers to it.
- PeterLemon_Timers
# PeterLemon video class (see §3): refs are unmapped-moment screenshots;
# playback verified WORKING but unmatchable in early frames; decoders proven
# by passing static siblings. Boxed; reopen only with author frame numbers.
- PeterLemon_GRB12LZDIFFRLEVideo
- PeterLemon_Rickroll
- PeterLemon_GRB15LZVideo
- PeterLemon_GRB12LZVideo
- PeterLemon_GRB12LZIPSVideo
- PeterLemon_DevoTimeOutForFun
- PeterLemon_GRB15LZIPSVideo
- PeterLemon_TouhouBadApple
- PeterLemon_BigBuckBunny
- PeterLemon_3DEngine
- PeterLemon_CylinderMap
# Velocity/Acceleration: see the affine note above (interacted refs).
- PeterLemon_Velocity
- PeterLemon_Acceleration
# mgba_suite_timing: research-grade (76/2020 fail; non-prefetch PERFECT).
# Details in box-verdicts §5 (A/B/C+D/E) and §6 (GBAHawk port, reverted).
# A (18): Thumb stack loads + prefetch + S-fast, -1 (mode-blind model
# can't express it; true-buffer sim falsified). B (12): LDMIA OAM->ROM
# overflow phase lottery (ov4/ov5 pin undo-all). E (32): DMA/ROM
# per-transfer -1, overconstrained X-vs-Y. C+D (14): IWRAM SWI +3 /
# CpuSet -66 with contradictory PeterLemon truths (per-path fitting
# banned). Port fixed 11 A-cells but regressed ~540 (kept on
# exp/gba-prefetch-buffer). See the suite's timing.c P/N/S matrix.
- mgba_suite_timing
# mgba_suite_timers: EXPECTED-FAIL (653/936; was quarantined hang, fixed
# via wake_latency burn + prescaler-tap-gated stale tick — see §8).
# Tried and reverted: register-settle/line-sample split + entry 23->25,
# sub-tick trial (380/936, races winnable but unfittable + pin cost).
# Details in box-verdicts §8 (trace findings, epi=7/wake=48 HLE-omission
# charges, remaining 283, and every closed follow-up: audit, staging
# split, storm structure, compensation, triangulation, HLE validation,
# tri-region, GBATEK反証, NON-HLE, rigidity, multi-direction, single-cell,
# fastraise, two-cause, high-grid, HLE-fidelity). Do NOT retune timer
# phase/charges/staging or fit IntrWait timing to chase single cells.
- mgba_suite_timers

