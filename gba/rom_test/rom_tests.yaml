# mgba_suite_timing: whole-case research-grade (76/2020 subtests fail
# with the shipped ROM; the old 1030/1244 count is from a previous suite
# build). Non-prefetch timing is PERFECT (every non-P cell passes): all 76
# residuals sit in prefetch (P) columns or IWRAM-SWI cells, in crisp
# groups (Got values via the case's sram enrichment):
# - A (18, BOXED): Thumb LDR/LDRH + prefetch + S-fast is -1 per stack load
#   (-2 for two-load snippets); ARM identicals pass, Thumb ROM-loads
#   pass, non-prefetch passes. Traced (activeTestInfo-gated erase probe,
#   since removed): erase inputs are IDENTICAL ARM/Thumb (prev=0 always —
#   bx resets lp, small waits never run the fill loop), so our model
#   erases the same for both and steps ARM 4 / Thumb 2 vs HW 4 / 3.
#   mGBA computes the same 4/2 by construction (mode-blind stall +
#   N32-S32 == N16-S16 post-body), so the HW +1/Thumb-load lives outside
#   the mGBA model class; a mode-dependent erase has no HW story.
#   TRUE-BUFFER SIM FALSIFIED (offline /tmp/prefetch_sim, GBATEK-locked:
#   8 slots, fill on GamePak-idle at S-rate following the code stream,
#   hit 0 waits, miss N/S by prev-cycle addr+width, branch discards):
#   the ARM-Thumb gap is a constant 2 for every exec base and every
#   branch/fill-source variant (S-slow gap 2 matches HW 9-7, but S-fast
#   stays 2 vs HW 4-3=1). A fill-dynamics buffer cannot produce HW's
#   fast-S-only gap shrink; the +1 needs an unknown fast-S-specific
#   Thumb-favoring mechanism. Per-cycle pipeline territory (unvalidated).
# - B (12, BOXED): LDMIA OAM->ROM overflow + prefetch is -1 in some P
#   columns (ov1: P.S/PNS, ov2: P../PN., ov3: P.S/PNS; ov4/ov5 pass all).
#   Non-monotonic in overflow depth (phase lottery on burst N/S
#   assignment); ov4/ov5 pin the current mixed-burst undo-all rule, and
#   any partial-erase refinement risks the 128kb/DMA-1244 pins. No
#   uniform rule fits the alternating columns. Revisit with per-cycle
#   CPU (burst phasing), not bus tweaks.
# - E (32, BOXED): DMA touching ROM + prefetch is -1 per transfer
#   (length-independent: trivial and short-16 agree). Linear
#   decomposition over the S-columns proves the split is transfer-side
#   (test code is identical across DMA types): (X) src-ROM fails fast-S
#   only, ARM-ONLY (16 cells); (Y) dst-ROM-only fails slow-S, both modes
#   (16 cells); both-ROM follows (X). No coherent single mechanism
#   (startup-arbitration, in-flight-fill, completion-handover and
#   S-word theories each fit one side and invert on the other); two
#   hyper-specific 3-way-gated terms would be fitting, not modeling.
# - C+D (14, BOXED — see below): SWI Div/Div2/Sqrt/Sqrt2/Sqrt3/ArcTan
#   from IWRAM are uniformly +3 (ARM+Thumb), CpuSet-from-IWRAM is -66.
#   C+D BOX (contradictory HW truths, do not touch): IWRAM entry -3 +
#   CpuSet overhead 69-for-IWRAM fixes all 14 exactly with zero churn
#   (verified: 76 -> 62, other cells bit-identical; -66 = -(69-3) locks
#   it structurally), but breaks 4 pixel-exact PeterLemon screenshots
#   (BIOSDIV/BIOSSQRT/BIOSARCTAN, all call SWI from IWRAM, TIMER0 digits
#   resolve +-3). Entry cost is path-independent on HW (real BIOS runs
#   from BIOS ROM; mGBA HLE entry confirms: stmfd + ldrb [lr,#-2] from
#   caller), yet all 7 suite paths demand -3 while all 4 PeterLemon
#   paths (Div-226/DivArm-229/Sqrt-585/ArcTan-neg) demand +0 with
#   disjoint path sets — so one side's HW truth is stale and no uniform
#   model can satisfy both (per-(path x region) fitting is banned, same
#   class as per-ROM branches; refills are HW-exact per the passing B/BX
#   cells, charges are pinned by ROM+EWRAM cells). Open: PeterLemon PNG
#   provenance (author HW photos vendored upstream) vs suite captures;
#   possible BIOS-revision divergence. Revisit only with new HW facts.
# The checks still run and report, and the case flips to
# unexpected-pass when the prefetch interactions land. See the suite's
# timing.c calibration + P/N/S matrix.
- mgba_suite_timing
# mgba_suite_timers: EXPECTED-FAIL (reaches END since the stale-tick
# gate; 401/936). History: quarantined hang (never reached END),
# root-caused to two ~1-cycle dispatch-ordering windows ("HW dispatch
# wins a race our staged IRQ pipeline loses"):
# - WAKE window (FIXED): the HLE IntrWait returns inline (zero cycles),
#   so the woken thread stores `irqCounter = ii` before the just-raised
#   IRQ line finishes staging (+2 after apply). On HW the real BIOS
#   IntrWait exit path (~10+ cycles) always loses that race, so the wake
#   dispatch consumes the prologue counter first. Fixed by `wake_latency`
#   (memory.rs/system.rs): an IntrWait-armed wake burns 8 CPU-stall
#   cycles (time still advances, line stages during the burn), forcing
#   dispatch-before-resume deterministically.
# - START-DELAY window (FIXED differently than first theorized): the hang
#   was NOT the HW-real stale overflow losing a dispatch race (that race
#   is unfittable within pin constraints -- see post-mortems below), but
#   a SPURIOUS stale overflow our model fabricated: the start-delay tick
#   unconditionally incremented the stale counter, so every prescaled or
#   count-up TM0 re-enable with a 0xFFFF stale raised a +1 overflow IRQ
#   HW never produces. The suite reuses TM0 across prescalers (0b -> 6b
#   -> 8b -> 10b), so these phantom dispatches killed staging timers and
#   stranded IntrWait. Fixed by gating the stale tick on the prescaler
#   tap (fires this tick only; count-up enables load outright), faithful
#   to nba OnControlWritten / issue #331 (timer.rs handle_start_delay).
#   /1 behavior is unchanged (tap fires every tick), so the nba
#   tick-before-reload pin (IF.3 + TM1 cascade) still holds, as do
#   start-stop, reload, irq-delay, cancel-ime/if and the Timing cells
#   (full manifest 122/123 identical, PhaseF->PhaseH).
#   POST-MORTEM (structural redesign attempted and REVERTED): separating
#   register-settle (pending apply +1, kept) from line-sample
#   (avail/line queues removed, combinatorial; IRQ_ENTRY 23->25 to hold
#   irq-delay totals) preserves cancel-ime 8/8 (row BOOLs come from
#   same-tick coalescing in the single pending slot, not queue order)
#   but structurally regresses irq-delay EWRAM/ROM (112/120 lost, no
#   entry value 25-27 recovers them) and cancel-ie rows (246->369px,
#   entry-invariant): with zero net wall-time shift, the earlier
#   preemption point still flips +-1-margin rows, and some dispatch
#   paths break beyond arithmetic. Uniform models cannot satisfy the
#   timers windows and the cancel/irq-delay pins at once; the
#   conflicting evidence needs a new model dimension, not a rebalance.
#   POST-MORTEM 2 (sub-tick trial: combinatorial line + entry 25, also
#   REVERTED): the suite DOES flow under it (END reached, 380/936 pass)
#   -- proving the races are winnable -- but residuals are unfittable
#   uniformly and the pin cost stands (irq-delay EWRAM/ROM, cancel-ie
#   rows). Superseded by the stale-tick gate (401/936, zero pin cost).
#   RESIDUALS (535, all d/i-independent and delay-row-independent for
#   0b): tight sums run one poll short (0x0005 2v3, 0x000D 3v4; 0x0001
#   passes at the floor), loose sums halve exactly when HW fits 2 polls
#   (0x000C/0x000D 16xs 0x10v0x20), values drift +-1..6 with mixed signs
#   (roundtrip-mod-reload-period aliasing). Same +-1-3 systematic class
#   as the Timing 76; no uniform knob fits without breaking the
#   irq-delay/cancel pins. Next step is a cycle trace of one cell (e.g.
#   0b,0x0005 1d1i tight: enable/overflow/stop/dispatch stamps vs the
#   poll-loop cost), not another global rebalance. Do NOT retune timer
#   phase/charges/staging or fit IntrWait timing to chase single cells.
#   TRACE FINDINGS (cycle-attributed via activeTestInfo testId/phase,
#   probes since removed): the tight loop costs P=8 (GBATEK-exact
#   1+3+1+3, so loop cost is NOT the error). For 0b,0x0005 (period 5)
#   the 2nd poll read and the first storm dispatch tie at the same
#   instruction-boundary tick and dispatch structurally wins the tie
#   (service_irq runs before cpu.step), giving 2v3; for 0b,0x000C
#   (period 12) the 2nd read beats the dispatch, giving 3v3. Values pin
#   X=(stopApply-firstOvf) to X=4 mod 5 (0x0005) and X=10 mod 12
#   (0x000C) on the IDENTICAL path, while the model yields 93 and 94:
#   0x000C already satisfies X=34 mod 60 and any uniform shift breaks
#   it, and the loop is already at ~1 cycle/insn (no shaveable floor).
#   EXPERIMENT (line+1/entry-1, total-preserving, REVERTED): sums +24
#   (all 0x000D/0x0024/0x0080 loose-halves complete -- unifying tight-1
#   and loose-half as preemption ties) but values -14 by boundary-slip
#   lottery (decision slips a full 5-cycle LDR past the tie, walking
#   residues mod p), the irq-delay check value moved, and cancel-ie
#   first-diff-pixel moved (count still 246). Uniform knobs are now
  #   exhaustively closed (entry, line, staging, start-delay,
  #   stop-deferral, P-floor): what remains is phase-dependent decision
  #   quantization or a cycle-exact CPU, both research-grade.
  #   ROUND-PAUSE + ENABLE-PHASE (traced, probes removed; 401 -> 653/936):
  #   per-cell cycle traces (testId 13/14, tight 1d1i) decompose the
  #   cascade-test (6b/8b/10b) error into two wall-clock terms: (a) every
  #   dispatch round pauses polling ~8 cycles short of HW (+1 poll per
  #   extra IRQ, tight and loose agree), and (b) the measured-enable
  #   lands ~40 wall cycles off HW's first-tick phase, uniform across
  #   /64, /256 and /1024 (1d1i all +6 polls = +48 with the round term;
  #   the 4d-row sign flip is a tap-boundary crossing HW makes and we
  #   don't). A boot-phase seed does nothing (each phase re-anchors to
  #   the /1024 sync-timer tap grid via IntrWait, killing history), so
  #   both terms are local to the wake/handler path. Two HLE-omission
  #   charges fix them -- a NEW model dimension (skipped real-BIOS code),
  #   not a rebalance of existing knobs:
  #   - HLE_IRQ_EPILOGUE_CYCLES = 7 (cpu/mod.rs trampoline): the HLE IRQ
  #     return skips the real-BIOS register-restore + exception-return
  #     sequence; charged where the user handler returns (both ARM and
  #     Thumb trampolines; the Thumb side previously lacked the return
  #     check entirely). Grid-fitted (5/7/9/11 x wake tried; 7 peaks).
  #   - wake_latency 8 -> 48 (memory.rs): recalibration of the fitted
  #     IntrWait exit-path cost; it sets each cell's enable phase against
  #     the tap grid. Grid optimum with the epilogue (ridge epi+wake ~= 55).
  #   Result 653/936 (+252) with ZERO pin cost: nba timer
  #   reload/start-stop/tick-before-reload pass, cancel-ime/if pass,
  #   cancel-ie and irq-delay bit-identical to baseline, timer-irq fail
  #   sets identical (54/90), Timing 1944/2020 and misc_edge 6/12
  #   unchanged (full manifest re-verified).
  #   REMAINING 283: (i) 0b small-period sums (0x0005 2v3 et al -- the
  #   dispatch-vs-read same-tick tie; flipping intra-tick order is
  #   global, affects PPU/DMA, not attempted); (ii) 0b values: large-
  #   period tight values sit uniformly +2 (frozen-at-disable measures
  #   dispatch->disable directly; ours runs 2 long in IWRAM -- same
  #   family as the irq-delay IWRAM +3), small periods scatter mod-p
  #   (true tie-race); (iii) ~20 scattered cascade sums. Note epi=7 is a
  #   compromise: cascade sums want the longer pause, frozen values want
  #   ~5 (epi=5 fixes values but loses ~85 sums to quantization); a
  #   single wall constant cannot satisfy both. Further progress needs
  #   sub-tick read/dispatch ordering or IWRAM micro-costs -- research.
  #   FOLLOW-UP (all probes removed, reverted to 653): 0b tests are ALL
  #   /1 (control 0xC0), so phaseless; their timelines are rigid under
  #   this model class -- proven, not just grid-fitted: (a) a per-
  #   instruction charge audit of dispatch->disable (89 wall: entry 23
  #   + IntrMain/findIRQ/got_handler/testIrq) matches GBATEK exactly,
  #   ruling out handler micro-costs; (b) pre-enable shifts transmit
  #   1:1 through the IntrWait+sync anchor with zero effect on /1
  #   frozen values (measured); (c) dispatch shifts < 8 are eaten by
  #   poll-loop boundaries (tight P=8). A raise-vs-write staging split
  #   (timer raises avail+0/line+1, writes unchanged) was implemented
  #   and FALSIFIED: frozen values invariant (anchor compensation),
  #   only race churn (+7 net: loose-1i flips vs 2i, a see-saw with no
  #   uniform point). Storm structure (0x000C loose: initial + cleanup
  #   dispatches, exit at first post-return ldr, r0 counts adds) shows
  #   HW's tail fits one more loose iteration (+23 wall) with no
  #   structural story that keeps tight frozen (-2) and EWRAM/ROM
  #   irq-delay exact at once. One internal suspect stands out with no
  #   HW evidence either way: `mov pc,lr` retires at 10 vs bx/bne at 3
  #   (refill dynamics concentrate at full-pc writes), same dimension
  #   as the epilogue charge, so no new info. The three pin families
  #   overconstrain D+E (timers wants 25, irq-delay EWRAM/ROM wants 27)
  #   with audited instructions between them: the uniform pipeline/
  #   entry model is exhausted mechanistically. Next needs either
  #   sub-tick same-boundary ordering or a fetch-overlap remodel, both
  #   requiring HW evidence. Do NOT refit epi/wake or add staging
  #   variants without it.
  #   TAKE-SKIP CLEANUP (zero-effect, full manifest bit-identical):
  #   step_channel skipped reload_pending.take() inside start-delay
  #   ticks (early return), delaying delay-window overwrites by up to 2
  #   extra ticks. Now consumed uniformly (nba OnReloadWritten is
  #   unconditional +1); normal path untouched so overflow-vs-landing
  #   races keep their order. The code comment already claimed uniform
  #   one-tick landing -- the code now matches it.
  #   RIGIDITY PROOF (empirical, probes removed): wake 48->56 (+8
  #   pre-enable shift) flips 141 cascade cells (phase response, as
  #   expected) but ZERO 0b cells -- every /1 sum and value bit-
  #   identical. Pre-enable shifts transmit 1:1 through the anchor for
  #   /1 (no phase), poll boundaries eat sub-8 dispatch shifts, and
  #   D/E/H are pinned/audited. /1-tight residuals are unfixable in
  #   {P=8, E=23, D=4, GBATEK-handler}: timers wants D+E=25 but
  #   irq-delay EWRAM/ROM wants 27. No wall, phase, or staging knob
  #   can move them; do not retry without new HW facts.
  #   MULTI-DIRECTION IMPOSSIBILITY (empirical, probes removed):
  #   wake 32/40/48/56/64 moves sums (peak 48) but tight1v (129) and
  #   loose16 fails (90, identical sets, zero churn) are perfectly
  #   rigid -- values are walls, sums are phase/pause/ties. Values
  #   want incompatible directions per (loop x rounds): tight 1i/2i
  #   -2, tight 4i 0, loose 1i +1, loose 2i/4i -1 (0x8000: tight
  #   805E->805C, loose 805D->805E/805C). No uniform constant can go
  #   (-2,0,+1,-1) at once; the only varying structure (rounds x loop
  #   code) is anchor-locked rigid. Per-cell fitting is forbidden.
  #   THREE-WAY D DISAGREEMENT (timer-irq traced, TEMP reverted):
  #   FFFF v0 shows enable->overwrite->DOUBLE-ovf (normal-path race,
  #   OLD reload twice -- the nba 32_7 pin race) then testIrq stop;
  #   v0-v3 read live (0,1,2,3), v4+ frozen 0x51. For v2 to read live,
  #   HW dispatch must come AFTER the sample (D >= +15), but
  #   irq-delay E/R exactness needs D=+0 and timers frozen needs
  #   D=-2. No uniform D satisfies (+15, 0, -2). Since E/R exactness
  #   is the simplest clean test and timers frozen is single-ovf
  #   clean, timer-irq v2+ expectations (intricate storm-adjacent
  #   live-samples) are least trustworthy -- likely stale or
  #   mGBA-generated (slow-D passes there by construction).
  #   DEPRIORITIZE timer-irq; do not chase v2+.
  #   DIFFERENT-MODEL SURVEY (no code change -- all dead except one
  #   direction): event-driven timer core (same spec, no observable
  #   change); context latencies (nested==outer same code; halted
  #   proven identical sets); sub-instruction phases (reads break
  #   sampling pins, writes cancel, decoupled lag is lottery); IO32
  #   half-split latch (counter-newer goes wrong way for frozen,
  #   direction-certain, not attempted). Sole viable different model
  #   is a PER-CYCLE ARM PIPELINE CPU (ARM ARM-faithful overlap):
  #   same GBATEK totals (P/E/H locked) but different sub-instruction
  #   distribution, moving only races/ties (frozen untouched -- walls
  #   same). Payoff partial by construction (~100 tie cells; frozen
  #   needs walls). Cost: core rewrite + full revalidation
  #   (multi-turn). Prereq: ARM7TDMI TRM facts (public). Direction
  #   recorded, not attempted this turn.
  #   SINGLE-CELL IMPOSSIBILITY (0x8000 1d1i: sums EXACT 4098 yet
  #   values +2; no code change): total wall exact forces (middle
  #   +2) + (ends -2) with start pinned exact by reload, hence tail
  #   -2 (ours short; HW tail longer via real-epi ~= 9). But tail
  #   lengthening (epi 7->9) is absorbed (frozen is pre-return!) and
  #   grid-worse-or-equal, while middle -2 is E/H-forbidden. One cell
  #   needs opposite wall moves in adjacent sub-walls -- no model in
  #   this class can do that. Strongest form of the box.
  #   FASTRAISE REFUTATION (raise avail+0/line+1 for timer raises;
  #   TEMP reverted): +7 net is loose-only boundary lottery (tight
  #   sums/values, frozen, and cancel-ie rows 2/4 with identical
  #   246px all immune). Raise-path changes cannot move tight
  #   dispatch (8-cycle boundaries eat <8); halted-gate variant is
  #   behaviorally identical (wake burn swallows sync). Loose tails
  #   (G1/G2 preemption points) are anchor-locked rigid. Raise/write
  #   split dead for the third time; do not retry.
  #   TWO-CAUSE REFUTATION (entry-core + EWRAM-fetch compensation;
  #   no code change): GBATEK原文 memory table gives EWRAM 3/3/6 FLAT
  #   (no S discount) and IWRAM 1/1/1 -- our waits match exactly, so
  #   EWRAM-fetch slowness cannot compensate an entry-core cut.
  #   N-terms jointly pinned with EWRAM/ROM exactness; IWRAM N-term
  #   already minimal (+0). Compensation dead on arrival. The wall is
  #   single (disable +2) with every sub-part pinned, audited, or
  #   GBATEK-exact -- not two compensating causes.
  #   TWO-CAUSE DECOMPOSITION (additive fit + order analysis + bug
  #   hunt a-h over ovf-IF/cascade/sampling/deferral/load/stale/split/
  #   phase; no code change): failing sums are uniform -1 poll (-16
  #   loose: single systematic shortfall + quantization), large tight
  #   values uniform +2 -- clean single-cause signatures in opposite
  #   directions (longer vs shorter). Same-tick order split (dispatch
  #   post-step, reads pre-step) is HW-plausible yet dead: reads are
  #   sampling-pinned, dispatch is quantization-eaten for tight,
  #   writes cancel (enable+disable shift together). Bug hunt: all
  #   consensus with NBA/mGBA/GBAHawk or pin-validated. So "two
  #   causes" resolves to (phase-cause FIXED at 653) + (wall-cause
  #   BLOCKED) + (order-cause DEAD) -- not two fixables. The wall
  #   cause is single (disable +2); race redistribution is its
  #   nonlinear shadow, not an independent lever.
  #   CROSS-EMULATOR TRIANGULATION (GBAHawk, mGBA, GBATEK原文; no code
  #   change, tree clean): GBAHawk timer (tim_upd) uses ST_Time=3 with
  #   Go-immediate-tick, net-identical to ours for /1 (load W+2 vs W+1
  #   but first tick W+3 both); its tap==(SubCnt&mask)==0 is a 1-phase
  #   convention variant absorbed by the wake fit; deferred disable +
  #   old-reload + count-up cascade all agree. mGBA uses immediate
  #   load + tap-align (no idle: ovf 2 EARLIER, wrong direction for
  #   frozen) and lazy CNT reads sampled at now-2 ("1N+1I preemptive"):
  #   now-2 is frozen-immune (every timers exit reads a stopped
  #   counter), running-reads only -- piecemeal transfer would break
  #   the exact reload pins, since (start, sampling) only work as a
  #   pair and HW has exactly one. GBATEK原文 externally validates
  #   every audited charge (MRS/MSR 1S, LDR 1S+1N+1I, STR 2N, LDM
  #   nS+1N+1I, STM (n-1)S+2N, B/BX 2S+1N), breaking the audit's
  #   circularity in our favor. Three implementations triangulate the
  #   same box from different sides; none offers a transferable timers
  #   fix. The only structurally live suspect remains fetch-refill
  #   dynamics (mov pc,lr retires at 10 vs bx/bne at 3), same dimension
  #   as the epilogue -- no new info without HW fetch-timing evidence.
  #   ADDENDUM (GBAHawk BIOS + mov-pc + now-2 resolutions, no code
  #   change): GBAHawk loads a REAL BIOS (GBA_load_bios, no HLE) -- it
  #   passes by emulating the real IntrWait/prologue/epilogue, while
  #   ours are fitted constants (wake/epi/entry); the fits ARE the HW
  #   values as best as uniform constants express (ridge/grid solved),
  #   and deriving them from BIOS structure would land on the same
  #   point -- no new info. mov-pc#10 is flat 3 + epi 7 + fill 0, not
  #   a refill bug (trace was taken with epi active); the audit
  #   stands as GBATEK-exact + fitted epi. mGBA now-2 reads are
  #   frozen-immune (all timers exits read stopped counters) and only
  #   valid paired with its immediate-start; piecemeal transfer would
  #   break the exact reload pins. Nothing transfers; box stands.
  #   HLE STRUCTURAL VALIDATION (mGBA hle-bios.s read; no code change):
  #   real-BIOS-equivalent sequences costed by GBATEK tables line up
  #   with the fits, upgrading them from fits to structured values:
  #   IRQ prologue (STMFD6+M0V+ADD+LDR-pc ~= 7+1+1+5=14) + ARM core
  #   entry (~4-9) ~= entry 23; IntrWait all-in (save+setup+discard+
  #   halt-loop+check+restore+return ~= 40-50) ~= wake 48. The epilogue
  #   (LDMFD6+SUBS ~= 8+5=13) does NOT line up with epi 7 -- epi stays
  #   an explicit pause compromise (cascade wants 7, frozen wants ~5),
  #   documented above. mGBA-shape start (immediate load, no idle)
  #   goes the wrong direction for frozen (-2 ovf shift) and breaks
  #   exact nba pins; not attempted. Entry N-term compensation hunt
  #   is dead: timers paths are IWRAM-only, EWRAM/ROM adjustments
  #   cannot reach them. The IWRAM-path +2 has no unblocked source;
  #   box stands triple-confirmed (pins, audit, cross-emu, HLE).
  #   TRI-REGION DISASSEMBLY (irq-delay.gba + live IWRAM/EWRAM dump;
  #   no code change): IWRAM/EWRAM/ROM test fns structurally identical
  #   (nop sled + mov/mov/str/ldr/strh/strb/strh(IME)/ldrb/cmp/beq/
  #   mov(exp)/ldrh/ldr/bl/pop/bx; flag always IWRAM), libgba master+
  #   handler identical across regions with identical charges. The
  #   IWRAM-only +3 lives in none of: test-fn code, master/handler
  #   instructions (GBATEK-exact), IME/IF/timer writes (shared),
  #   fetches (IWRAM N=S=1, no cold effects), entry N-term (EWRAM/ROM
  #   exactness forbids moves), IME landing (cancels vs the restart),
  #   preemption phase (timers would move too). EWRAM-IWRAM deltas
  #   (HW 20 vs ours 17) isolate a 3 in region waits or refill N-term
  #   that no exact pin can absorb. Same impossibility shape as +2.
  #   GBATEK-原文説の反証 (THUMB含む全命令; no code change):
  #   THUMB LDR 1S+1N+1I / STR 2N / PUSH (n-1)S+2N / POP nS+1N+1I /
  #   B-taken 2S+1N / B-nt 1S / BX 2S+1N / BL 3S+1N -- ARM表と同一で
  #   全chargeと一致。testIrq(Thumb)とirq_handler(ARM)の差は純粋な
  #   仕事量差 (19 vs 25) で単価差なし。IntrMain-onlyな特殊opなし。
  #   P=8がIO32-LDR=3をlocking (+12%ずれ prohibitive)。delay loop
  #   はlever不足 (tap-crossingに要する~50に届かない)。GBATEK誤記で
  #   +2を出すには汎用op誤記が必要だがpass中の他全てを壊す。
  #   選択肢1は反証済み.
  #   NON-HLE EXHAUSTION (no code change): per redirect, every non-HLE
  #   component re-audited. Fetch/wait dynamics are inert for IWRAM/IO
  #   (no N/S splits; prefetch off; ROM-gated breaks), so the IWRAM
  #   path is flat bases (GBATEK-exact) + entry + pipeline only. Write
  #   landing (model-start vs HW data-phase) cancels for frozen and
  #   transmits 1:1 for sums; fixing it would ADD ticks (wrong way).
  #   Deferred stop is load-bearing exact (start-stop 2ND). Raise-path
  #   D is unpinned but any <8 shift is eaten by poll boundaries
  #   (proven twice) and >=8 is absurd. Composition bugs ruled out
  #   (take() clears, max(1) inert with prefetch off, bulk inactive,
  #   APU/DMA/PPU inert, mirrors uninvolved, HLE loop unimplementable
  #   without the binary so burn stands). suite.gba timers table
  #   verified byte-identical to repo src (no version skew). Left:
  #   D+E split (25 vs 27) with every sub-part pinned or audited.
  #   HIGH-GRID NEGATIVE (epi 11-19 x wake 48-96, all 400-510, TEMP
  #   reverted): the per-round +1 growth (uniform across /1//64//256/
  #   /1024, so pause not period) is NOT fixable by longer pause --
  #   epi+8 breaks base cells by lottery faster than it fixes growth.
  #   Decomposition shows why: pause/8 boundary quantization means a
  #   +/-4 wall (not +8) is needed, but every +/-4 source is global
  #   (entry/master/testIrq/IntrRet/epi/return all shared or audited).
  #   Compensation theories dead too (DMA direction EWARM-fast vs
  #   needed-slow; P locked; N-terms jointly pinned). The +1/round is
  #   quantization-locked: structurally identical pauses differing by
  #   boundary luck. No global direction left; box stands.
- mgba_suite_timers

