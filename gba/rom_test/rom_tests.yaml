rom_root: ../../roms/gba
suites:
  - name: jsmolka_gba-tests
    cases:
      # These aggregate ROMs leave the first failed test number in R12/R7.
      # Zero therefore means that every embedded instruction test completed.
      - id: jsmolka_arm
        rom: arm/arm.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
      - id: jsmolka_thumb
        rom: thumb/thumb.gba
        cycles: 1000000
        verify:
          registers:
            r7: 0x00
      - id: jsmolka_memory
        rom: memory/memory.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
