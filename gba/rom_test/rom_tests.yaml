rom_root: ../../roms/gba
expected_failures:
  # ARM flags test #106: overflow flag behavior remains inaccurate.
  - jsmolka_arm
  # Thumb memory test #227: execution advances past the fixed LDRH #211 case.
  - jsmolka_thumb
completion_profiles:
  result_ready:
    poll_interval: 256
    stages:
      - memory:
          - address: 0x02000000
            not_value: 0x00
suites:
  - name: mgba
    case_patterns:
      - glob: suite/mgba/arm/*.gba
        id_prefix: mgba_arm_
        cycles: 100000
        completion: result_ready
        verify:
          memory:
            - address: 0x02000000
              value: 0x01
      - glob: suite/mgba/thumb/*.gba
        id_prefix: mgba_thumb_
        cycles: 100000
        completion: result_ready
        verify:
          memory:
            - address: 0x02000000
              value: 0x01
  - name: custom
    cases:
      - id: custom_mem_test
        rom: mem_test.gba
        cycles: 100000
        verify:
          memory:
            - address: 0x02000000
              value: 0x01
  - name: jsmolka_gba-tests
    cases:
      # These aggregate ROMs leave the first failed test number in R12/R7.
      # Zero therefore means that every embedded instruction test completed.
      - id: jsmolka_arm
        rom: arm/arm.gba
        cycles: 1000000
        verify:
          registers:
            r12: 0x00
      - id: jsmolka_thumb
        rom: thumb/thumb.gba
        cycles: 1000000
        verify:
          registers:
            r7: 0x00
