schema_version: 2
templates:
  row:
    root:
      type: StackLayout
      id: row
      orientation: Horizontal
      gap: 6
      padding: 4
      children:
        - type: TextBox
          id: name
          text: {bind: {path: name, mode: TwoWay}}
        - type: Button
          id: rename
          text: {literal: Uppercase item}
          command: rename
          argument: {bind: {path: name}}
        - type: Native
          id: progress
          factory: crate::meter
          value: {bind: {path: progress}}
root:
  type: Window
  id: main
  title: {literal: Wakui 2 — macro-driven layouts and MVVM}
  menus:
    - id: actions
      title: {literal: Actions}
      items: {bind: {path: menu_items}}
      command: choose
  content:
    type: StackLayout
    id: screen
    padding: 16
    gap: 8
    children:
      - type: Grid
        id: fields
        columns: 2
        gap: 8
        children:
          - type: TextBox
            id: name
            text: {bind: {path: name, mode: TwoWay}}
            validation: {validator: crate::validate_name, error: name_error, pending: validating}
            style: {placement: {row: 0, column: 0}}
          - type: Label
            id: echo
            text: {bind: {path: name}}
            style: {placement: {row: 0, column: 1}}
          - type: TextBox
            id: readonly
            text: {bind: {path: name}}
            style: {placement: {row: 1, column: 0}}
          - type: Label
            id: error
            text: {bind: {path: name_error}}
            style: {placement: {row: 1, column: 1}}
      - type: FlexLayout
        id: commands
        gap: 8
        children:
          - type: TextBox
            id: number
            text: {bind: {path: progress, mode: TwoWay, converter: crate::NumberText}}
            style: {placement: {width: 120}}
          - type: Native
            id: meter
            factory: crate::meter
            value: {bind: {path: progress}}
            style: {placement: {width: 120}}
          - type: Button
            id: save
            text: {literal: Save asynchronously}
            command: save
          - type: Button
            id: reverse
            text: {literal: Reverse and select first}
            command: reverse
      - type: Label
        id: status
        text: {bind: {path: status}}
      - type: ItemsControl
        id: rows
        items: {bind: {path: rows}}
        viewport: {bind: {path: viewport, mode: TwoWay}}
        item_template: row
      - type: ContentControl
        id: selected
        content: {bind: {path: selected}}
        content_template: row
      - type: AbsoluteLayout
        id: absolute
        padding: 4
        style: {placement: {height: 48}}
        children:
          - type: Label
            id: absolute_caption
            text: {literal: "Absolute: x=12, y=4"}
            style: {placement: {x: 12, y: 4, width: 240, height: 24}}
      - type: BindableLayout
        id: bound_rows
        items: {bind: {path: rows}}
        viewport: {literal: {start: 0, count: 1, row_height: 64}}
        item_template: row