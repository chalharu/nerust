[workspace]
members = ["runtime", "markup", "macros", "gtk", "tao", "demo", "settings"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.95"

[workspace.dependencies]
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = "=2.0.0"
wakui2-runtime = { path = "runtime" }
wakui2-markup = { path = "markup" }
wakui2-macros = { path = "macros" }
wakui2-gtk = { path = "gtk" }
wakui2-tao = { path = "tao" }

[profile.dev]
debug = 0
[profile.test]
debug = 0