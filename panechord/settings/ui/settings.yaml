schema_version: 2
root:
  type: Window
  id: main
  title: {literal: "Panechord — Settings"}
  menus:
    - id: file
      title: {literal: File}
      items: {bind: {path: ui.menu_items}}
      command: choose
  content:
    type: StackLayout
    id: screen
    padding: 20
    gap: 8
    children:
      - type: Label
        id: heading
        text: {literal: "Player preferences — changes apply only after Save"}
      - type: Label
        id: name_caption
        text: {literal: "Player name (1–80 characters)"}
      - type: TextBox
        id: name
        text: {bind: {path: draft.name, mode: TwoWay}}
      - type: Label
        id: volume_caption
        text: {literal: "Volume (0–100)"}
      - type: TextBox
        id: volume
        text: {bind: {path: draft.volume, mode: TwoWay}}
      - type: Label
        id: scale_caption
        text: {literal: "Display scale (0.5–3)"}
      - type: TextBox
        id: scale
        text: {bind: {path: draft.scale, mode: TwoWay}}
      - type: Label
        id: error
        text: {bind: {path: ui.error}}
      - type: TextBox
        id: summary
        text: {bind: {path: ui.summary}}
      - type: Label
        id: status
        text: {bind: {path: ui.status}}
      - type: StackLayout
        id: actions
        orientation: Horizontal
        gap: 8
        children:
          - type: Button
            id: save
            text: {literal: Save}
            command: save
            argument: {bind: {path: stay}}
          - type: Button
            id: cancel
            text: {literal: Cancel changes}
            command: cancel
      - type: Label
        id: warning
        text: {bind: {path: ui.warning}}
      - type: StackLayout
        id: confirmation
        orientation: Horizontal
        gap: 8
        children:
          - type: Button
            id: save_exit
            text: {literal: Save and exit}
            command: save_exit
            argument: {bind: {path: leave}}
          - type: Button
            id: discard_exit
            text: {literal: Discard and exit}
            command: discard_exit
          - type: Button
            id: keep_editing
            text: {literal: Keep editing}
            command: keep_editing