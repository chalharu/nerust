[package]
name = "panechord-native"
description = "Platform-default Panechord backend selection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
panechord-gtk.workspace = true

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly", target_os = "macos")))'.dependencies]
panechord-tao.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
panechord-macos.workspace = true
