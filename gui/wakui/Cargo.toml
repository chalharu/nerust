[package]
authors.workspace = true
description = "Cross-platform native UI framework core: controls, binding, mapper, turn driver"
edition.workspace = true
license.workspace = true
name = "wakui"
rust-version.workspace = true
version.workspace = true

[features]
default = ["wakui_default"]
gtk = ["wakui_gtk"]
tao = ["wakui_tao"]

[dependencies]
wakui_core.workspace = true
wakui_gtk = { optional = true, workspace = true }
wakui_tao = { optional = true, workspace = true }
wakui_default = { optional = true, workspace = true }
