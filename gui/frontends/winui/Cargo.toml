[package]
authors.workspace = true
description = "Prototype WinUI 3-native frontend over the shared frontend host"
edition.workspace = true
license.workspace = true
name = "nerust_winui"
rust-version.workspace = true
version.workspace = true

[dependencies]
log.workspace = true
nerust_core_traits.workspace = true
nerust_frontend_host.workspace = true
nerust_frontend_kernel.workspace = true
nerust_gui_runtime.workspace = true
nerust_gui_shell.workspace = true
nerust_gui_viewmodel.workspace = true
nerust_input_traits.workspace = true
nerust_keyboard.workspace = true
nerust_render_traits = { features = ["renderer"], workspace = true }
nerust_settings_core.workspace = true
nerust_system_traits.workspace = true
nerust_win.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
nerust_nes_factory.workspace = true
windows-collections = "=0.3.2"
windows-core = "=0.62.2"
windows-future = "=0.3.2"
windows-link = "=0.2.1"
windows-numerics = "=0.3.1"

[dev-dependencies]

[[bin]]
name = "nerust_winui"
path = "src/main.rs"
