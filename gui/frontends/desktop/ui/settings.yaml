schema_version: 2
templates:
  choice_row:
    root:
      type: StackLayout
      id: choice_row
      orientation: Horizontal
      gap: 12
      children:
        - type: Label
          id: label
          style: {vertical_alignment: Center, placement: {width: 192}}
          text: {bind: {path: label, source: External}}
        - type: Combo
          id: choice
          style: {horizontal_alignment: Start, vertical_alignment: Center}
          enabled: {bind: {path: enabled, source: External}}
          items: {bind: {path: choices, source: External}}
          selected: {bind: {path: selected, source: External, mode: TwoWay}}
  check_row:
    root:
      type: StackLayout
      id: check_row
      children:
        - type: CheckBox
          id: check
          text: {bind: {path: label, source: External}}
          checked: {bind: {path: checked, source: External, mode: TwoWay}}
  reset_row:
    root:
      type: StackLayout
      id: reset_row
      children:
        - type: Button
          id: reset_button
          style: {horizontal_alignment: End}
          text: {bind: {path: label, source: External}}
          command: reset
  binding_row:
    root:
      type: StackLayout
      id: binding_row
      orientation: Horizontal
      gap: 8
      children:
        - type: Label
          id: label
          style: {vertical_alignment: Center, placement: {width: 160}}
          text: {bind: {path: label, source: External}}
        - type: Label
          id: value
          style: {horizontal_alignment: Stretch, vertical_alignment: Center}
          text: {bind: {path: value, source: External}}
        - type: Button
          id: change
          style: {horizontal_alignment: Start, vertical_alignment: Center}
          text: {bind: {path: change_label, source: External}}
          command: capture
        - type: Button
          id: clear
          style: {horizontal_alignment: Start, vertical_alignment: Center}
          text: {bind: {path: clear_label, source: External}}
          command: clear
  binding_page:
    root:
      type: StackLayout
      id: binding_section
      gap: 6
      children:
        - type: Label
          id: binding_section_label
          style: {text: {role: Subtitle, scale: 1.0}}
          text: {bind: {path: label, source: External}}
        - type: Repeat
          id: bindings
          padding: 6
          gap: 8
          items: {bind: {path: rows, source: External}}
          item_template: binding_row
  general_tab:
    root:
      type: StackLayout
      id: general_fields
      padding: 6
      gap: 12
      children:
        - type: StackLayout
          id: app_group
          visible: {bind: {path: show_app}}
          gap: 12
          children:
            - type: ContentControl
              id: language
              content: {bind: {path: language}}
              content_template: choice_row
            - type: ContentControl
              id: storage
              content: {bind: {path: storage}}
              content_template: choice_row
            - type: TextBox
              id: storage_directory
              visible: {bind: {path: directory_visible, source: External}}
              text: {bind: {path: directory, source: External, mode: TwoWay}}
            - type: Repeat
              id: app_resets
              items: {bind: {path: resets}}
              gap: 6
              item_template: reset_row
        - type: StackLayout
          id: video_group
          visible: {bind: {path: show_video}}
          gap: 12
          children:
            - type: ContentControl
              id: fullscreen
              content: {bind: {path: fullscreen}}
              content_template: check_row
            - type: ContentControl
              id: vsync
              content: {bind: {path: vsync}}
              content_template: check_row
            - type: ContentControl
              id: scaling
              content: {bind: {path: scaling}}
              content_template: choice_row
            - type: Repeat
              id: video_resets
              items: {bind: {path: resets}}
              gap: 6
              item_template: reset_row
        - type: StackLayout
          id: audio_group
          visible: {bind: {path: show_audio}}
          gap: 12
          children:
            - type: ContentControl
              id: muted
              content: {bind: {path: muted}}
              content_template: check_row
            - type: StackLayout
              id: volume_row
              orientation: Horizontal
              gap: 12
              children:
                - type: Label
                  id: volume_label
                  style: {placement: {width: 120}}
                  text: {bind: {path: volume_label, source: External}}
                - type: Slider
                  id: volume
                  value: {bind: {path: volume, source: External, mode: TwoWay}}
                  min: 0
                  max: 100
                  step: 1
            - type: ContentControl
              id: sample_rate
              content: {bind: {path: sample_rate}}
              content_template: choice_row
            - type: StackLayout
              id: latency_row
              orientation: Horizontal
              gap: 12
              children:
                - type: Label
                  id: latency_label
                  style: {placement: {width: 120}}
                  text: {bind: {path: latency_label, source: External}}
                - type: Slider
                  id: latency
                  value: {bind: {path: latency, source: External, mode: TwoWay}}
                  min: 10
                  max: 200
                  step: 1
            - type: Repeat
              id: audio_resets
              items: {bind: {path: resets}}
              gap: 6
              item_template: reset_row
        - type: StackLayout
          id: rumble_group
          visible: {bind: {path: show_rumble}}
          gap: 12
          children:
            - type: ContentControl
              id: rumble_motion
              content: {bind: {path: rumble_motion}}
              content_template: check_row
            - type: ContentControl
              id: rumble_enabled
              content: {bind: {path: rumble_enabled}}
              content_template: check_row
            - type: StackLayout
              id: strength_row
              orientation: Horizontal
              gap: 12
              children:
                - type: Label
                  id: strength_label
                  style: {placement: {width: 120}}
                  text: {bind: {path: rumble_strength_label, source: External}}
                - type: Slider
                  id: strength
                  value: {bind: {path: rumble_strength, source: External, mode: TwoWay}}
                  min: 0
                  max: 100
                  step: 1
            - type: ContentControl
              id: rumble_target
              content: {bind: {path: rumble_target}}
              content_template: choice_row
            - type: Repeat
              id: rumble_resets
              items: {bind: {path: resets}}
              gap: 6
              item_template: reset_row
  controller_page:
    root:
      type: StackLayout
      id: controller_fields
      padding: 6
      gap: 6
      children:
        - type: Repeat
          id: controller_slots
          items: {bind: {path: slots}}
          gap: 6
          item_template: choice_row
        - type: Label
          id: keyboard_note
          text: {bind: {path: keyboard_note, source: External}}
        - type: Repeat
          id: controller_keys
          items: {bind: {path: key_sections, source: External}}
          gap: 6
          item_template: binding_page
  system_page:
    root:
      type: StackLayout
      id: system_fields
      padding: 6
      gap: 6
      children:
        - type: ItemsControl
          id: fields
          items: {bind: {path: fields}}
          viewport: {bind: {path: viewport}}
          item_template: choice_row
  gamepad_block:
    root:
      type: StackLayout
      id: pad_block
      padding: 6
      gap: 6
      children:
        - type: Label
          id: pad_name
          style: {text: {role: Subtitle, scale: 1.0}}
          text: {bind: {path: label, source: External}}
        - type: ContentControl
          id: assignment
          content: {bind: {path: assignment}}
          content_template: choice_row
        - type: ContentControl
          id: deadzone
          content: {bind: {path: deadzone}}
          content_template: choice_row
        - type: ContentControl
          id: dpad
          content: {bind: {path: dpad}}
          content_template: choice_row
        - type: Repeat
          id: pad_sections
          items: {bind: {path: sections, source: External}}
          gap: 6
          item_template: binding_page
root:
  type: Window
  id: settings_window
  title: {bind: {path: labels.title, source: External}}
  content:
    type: StackLayout
    id: content
    padding: 12
    gap: 12
    children:
      - type: Tab
        id: pages
        position: Left
        presentation: Sidebar
        selected: {bind: {path: page, source: External, mode: TwoWay}}
        pages:
          - id: general
            title: {bind: {path: labels.tab_general, source: External}}
            content:
              type: TabItems
              id: general_tabs
              selected: {bind: {path: general_selection, source: External, mode: TwoWay}}
              items: {bind: {path: general_tabs, source: External}}
              title: {bind: {path: label}}
              item_template: general_tab
          - id: controllers
            title: {bind: {path: labels.tab_controllers, source: External}}
            content:
              type: Scroll
              id: controllers_scroll
              content:
                type: TabItems
                id: controllers_tabs
                selected: {bind: {path: controllers_selection, source: External, mode: TwoWay}}
                items: {bind: {path: controllers_pages, source: External}}
                title: {bind: {path: label}}
                item_template: controller_page
          - id: gamepads
            title: {bind: {path: labels.tab_gamepads, source: External}}
            content:
              type: StackLayout
              id: gamepads_column
              gap: 6
              children:
                - type: Repeat
                  id: gamepad_blocks
                  items: {bind: {path: gamepads_blocks, source: External}}
                  gap: 12
                  item_template: gamepad_block
          - id: shortcuts
            title: {bind: {path: labels.tab_shortcuts, source: External}}
            content:
              type: StackLayout
              id: shortcuts_fields
              padding: 6
              gap: 6
              children:
                - type: Repeat
                  id: shortcuts_section
                  items: {bind: {path: shortcuts_page, source: External}}
                  gap: 6
                  item_template: binding_page
                - type: Repeat
                  id: shortcuts_resets
                  items: {bind: {path: shortcuts_resets, source: External}}
                  gap: 6
                  item_template: reset_row
          - id: notifications
            title: {bind: {path: labels.tab_notifications, source: External}}
            content:
              type: Scroll
              id: notification_viewport
              content:
                type: StackLayout
                id: notification_fields
                padding: {left: 12, right: 12}
                gap: 12
                children:
                  - type: StackLayout
                    id: information
                    gap: 8
                    children:
                      - type: Label
                        id: info_label
                        style: {text: {role: Subtitle, scale: 1.0}}
                        text: {bind: {path: labels.info, source: External}}
                      - type: CheckBox
                        id: info_enabled
                        text: {bind: {path: labels.info_enabled, source: External}}
                        checked: {bind: {path: info_enabled, source: External, mode: TwoWay}}
                      - type: Label
                        id: info_duration_label
                        text: {bind: {path: labels.info_duration, source: External}}
                      - type: TextBox
                        id: info_duration
                        text: {bind: {path: info_duration, source: External, mode: TwoWay}}
                      - {type: Label, id: info_color_label, text: {bind: {path: labels.info_color, source: External}}}
                      - type: Combo
                        id: info_color
                        items: {bind: {path: info_color.items, source: External}}
                        selected: {bind: {path: info_color.selected, source: External, mode: TwoWay}}
                  - type: StackLayout
                    id: warning
                    gap: 8
                    children:
                      - type: Label
                        id: warning_label
                        style: {text: {role: Subtitle, scale: 1.0}}
                        text: {bind: {path: labels.warning, source: External}}
                      - type: CheckBox
                        id: warning_enabled
                        text: {bind: {path: labels.warning_enabled, source: External}}
                        checked: {bind: {path: warning_enabled, source: External, mode: TwoWay}}
                      - type: Label
                        id: warning_duration_label
                        text: {bind: {path: labels.warning_duration, source: External}}
                      - type: TextBox
                        id: warning_duration
                        text: {bind: {path: warning_duration, source: External, mode: TwoWay}}
                      - type: Label
                        id: warning_color_label
                        text: {bind: {path: labels.warning_color, source: External}}
                      - type: Combo
                        id: warning_color
                        items: {bind: {path: warning_color.items, source: External}}
                        selected: {bind: {path: warning_color.selected, source: External, mode: TwoWay}}
                  - type: StackLayout
                    id: error
                    gap: 8
                    children:
                      - type: Label
                        id: error_label
                        style: {text: {role: Subtitle, scale: 1.0}}
                        text: {bind: {path: labels.error, source: External}}
                      - type: CheckBox
                        id: error_enabled
                        text: {bind: {path: labels.error_enabled, source: External}}
                        checked: {bind: {path: error_enabled, source: External, mode: TwoWay}}
                      - type: CheckBox
                        id: error_modal
                        text: {bind: {path: labels.error_modal, source: External}}
                        checked: {bind: {path: error_modal, source: External, mode: TwoWay}}
                      - {type: Label, id: error_color_label, text: {bind: {path: labels.error_color, source: External}}}
                      - type: Combo
                        id: error_color
                        items: {bind: {path: error_color.items, source: External}}
                        selected: {bind: {path: error_color.selected, source: External, mode: TwoWay}}
                  - type: StackLayout
                    id: notification_display
                    gap: 8
                    children:
                      - type: Label
                        id: position_label
                        style: {text: {role: Subtitle, scale: 1.0}}
                        text: {bind: {path: labels.display_section, source: External}}
                      - type: Combo
                        id: position
                        items: {bind: {path: position.items, source: External}}
                        selected: {bind: {path: position.selected, source: External, mode: TwoWay}}
                      - type: Combo
                        id: area
                        items: {bind: {path: area.items, source: External}}
                        selected: {bind: {path: area.selected, source: External, mode: TwoWay}}
                  - type: StackLayout
                    id: status_display
                    gap: 8
                    children:
                      - type: Label
                        id: status_display_label
                        style: {text: {role: Subtitle, scale: 1.0}}
                        text: {bind: {path: labels.status_section, source: External}}
                      - type: CheckBox
                        id: status_enabled
                        text: {bind: {path: labels.status_enabled, source: External}}
                        checked: {bind: {path: status_enabled, source: External, mode: TwoWay}}
                      - type: Combo
                        id: status_position
                        items: {bind: {path: status_position.items, source: External}}
                        selected: {bind: {path: status_position.selected, source: External, mode: TwoWay}}
                      - type: Combo
                        id: status_area
                        enabled: {bind: {path: status_area_enabled, source: External}}
                        items: {bind: {path: status_area.items, source: External}}
                        selected: {bind: {path: status_area.selected, source: External, mode: TwoWay}}
                      - type: Label
                        id: status_area_follows
                        visible: {bind: {path: status_area_follows, source: External}}
                        text: {bind: {path: labels.follow_note, source: External}}
          - id: advanced
            title: {bind: {path: labels.tab_advanced, source: External}}
            content:
              type: Scroll
              id: advanced_scroll
              content:
                type: TabItems
                id: machine_tabs
                selected: {bind: {path: systems_selection, source: External, mode: TwoWay}}
                items: {bind: {path: systems_pages, source: External}}
                title: {bind: {path: label}}
                item_template: system_page
      - {type: Label, id: status, text: {bind: {path: status, source: External}}}
      - type: DialogFooter
        id: actions
        accept_text: {bind: {path: labels.save, source: External}}
        accept_command: accept
        cancel_text: {bind: {path: labels.cancel, source: External}}
        cancel_command: cancel
      - type: StackLayout
        id: confirmation
        gap: 8
        visible: {bind: {path: confirmation, source: External}}
        children:
          - {type: Label, id: confirm_label, text: {bind: {path: labels.confirm, source: External}}}
          - type: DialogFooter
            id: confirm_actions
            destructive: true
            accept_text: {bind: {path: labels.discard, source: External}}
            accept_command: discard
            cancel_text: {bind: {path: labels.keep, source: External}}
            cancel_command: keep
