schema_version: 2
templates:
  image:
    root:
      type: StackLayout
      id: image_block
      gap: 12
      children:
        - {type: Label, id: title, text: {bind: {path: label}}}
        - {type: Image, id: image, style_binding: {bind: {path: style}}, source: {bind: {path: source}}, pointer: {bind: {path: pointer, mode: TwoWay}}}
root:
  type: Window
  id: ppu_window
  title: {bind: {path: title}}
  content:
    type: StackLayout
    id: content
    style: {vertical_alignment: Stretch}
    gap: 12
    children:
      - {type: Label, id: hover, text: {bind: {path: hover}}}
      - type: Scroll
        id: scroll
        style: {vertical_alignment: Stretch}
        content:
          type: StackLayout
          id: images
          padding: 16
          gap: 12
          children:
            - {type: Repeat, id: pictures, items: {bind: {path: images}}, gap: 12, item_template: image}
            - {type: Label, id: panels, visible: {bind: {path: has_panels}}, style: {text: {role: Code}}, text: {bind: {path: panels}}}
            - {type: Label, id: empty, visible: {bind: {path: is_empty}}, text: {bind: {path: empty}}}