[package]
authors.workspace = true
description = "Prototype Win32-native frontend over the shared frontend host"
edition.workspace = true
license.workspace = true
name = "nerust_win"
rust-version.workspace = true
version.workspace = true

[dependencies]
log.workspace = true
nerust_core_traits.workspace = true
nerust_frontend_host.workspace = true
nerust_frontend_kernel.workspace = true
nerust_gui_runtime.workspace = true
nerust_gui_shell.workspace = true
nerust_gui_viewmodel.workspace = true
nerust_input_traits.workspace = true
nerust_keyboard.workspace = true
nerust_render_traits = { features = ["renderer"], workspace = true }
nerust_settings_core.workspace = true
nerust_system_traits.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_KeyboardAndMouse",
] }
nerust_nes_factory.workspace = true
